<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 データ確認画面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
        }
        .section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }
        .btn {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: linear-gradient(45deg, #ff9800, #ffc107);
            color: #2d1b69;
        }
        .btn-danger {
            background: linear-gradient(45deg, #f44336, #e57373);
        }
        .data-display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .status {
            padding: 8px 15px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status-success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        .status-error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
            color: #f44336;
        }
        .status-info {
            background: rgba(33, 150, 243, 0.3);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 データストレージ確認画面</h1>
            <p>localStorageのクーポンデータと統合管理データを確認</p>
        </div>

        <div class="section">
            <h2>📊 現在のデータ状況</h2>
            <div class="btn-group">
                <button class="btn" onclick="checkAllData()">🔄 全データ確認</button>
                <button class="btn btn-secondary" onclick="createTestCoupons()">🧪 テストクーポン作成</button>
                <button class="btn btn-danger" onclick="clearAllData()">🗑️ 全データクリア</button>
            </div>
            <div id="status-area"></div>
        </div>

        <div class="section">
            <h2>🎫 クーポンデータ (salon_coupons)</h2>
            <div class="btn-group">
                <button class="btn" onclick="showCouponData()">📋 クーポン表示</button>
                <button class="btn btn-secondary" onclick="exportCouponData()">📥 データエクスポート</button>
            </div>
            <div id="coupon-data" class="data-display"></div>
        </div>

        <div class="section">
            <h2>🎛️ 統合管理データ (salon_integrated_admin)</h2>
            <div class="btn-group">
                <button class="btn" onclick="showIntegratedData()">📋 統合データ表示</button>
                <button class="btn btn-secondary" onclick="syncDataSystems()">🔄 データ同期テスト</button>
            </div>
            <div id="integrated-data" class="data-display"></div>
        </div>

        <div class="section">
            <h2>🧪 テスト機能</h2>
            <div class="btn-group">
                <button class="btn" onclick="testAlert()">⚠️ 動作テスト</button>
                <button class="btn" onclick="testDataFlow()">🔬 データ連携テスト</button>
                <button class="btn btn-secondary" onclick="openUltimateAdmin()">🎫 クーポン管理画面</button>
                <button class="btn btn-secondary" onclick="openIntegratedAdmin()">🎛️ 統合管理画面</button>
            </div>
            <div id="test-results" class="data-display"></div>
        </div>
    </div>

    <script>
        // グローバルエラーハンドラー
        window.addEventListener('error', function(e) {
            console.error('JavaScript エラー:', e.error);
            alert('JavaScript エラーが発生しました: ' + e.error.message);
        });
        
        // ページ読み込み完了時の確認
        document.addEventListener('DOMContentLoaded', function() {
            console.log('ページ読み込み完了');
            console.log('test-results 要素:', document.getElementById('test-results'));
        });

        // 動作テスト関数
        function testAlert() {
            alert('JavaScript が正常に動作しています！');
            console.log('testAlert 関数が実行されました');
        }

        function showStatus(message, type = 'info') {
            const statusArea = document.getElementById('status-area');
            const statusDiv = document.createElement('div');
            statusDiv.className = `status status-${type}`;
            statusDiv.textContent = message;
            statusArea.appendChild(statusDiv);
            
            // 5秒後に自動削除
            setTimeout(() => {
                statusDiv.remove();
            }, 5000);
        }

        function checkAllData() {
            const couponData = localStorage.getItem('salon_coupons');
            const integratedData = localStorage.getItem('salon_integrated_admin');
            const usageData = localStorage.getItem('salon_coupon_usage');
            
            let message = `📊 データ確認結果:\n`;
            message += `- salon_coupons: ${couponData ? 'あり (' + Object.keys(JSON.parse(couponData)).length + '件)' : 'なし'}\n`;
            message += `- salon_integrated_admin: ${integratedData ? 'あり' : 'なし'}\n`;
            message += `- salon_coupon_usage: ${usageData ? 'あり (' + JSON.parse(usageData).length + '件)' : 'なし'}`;
            
            showStatus(message, couponData ? 'success' : 'error');
        }

        function showCouponData() {
            const data = localStorage.getItem('salon_coupons');
            const display = document.getElementById('coupon-data');
            
            if (data) {
                try {
                    const coupons = JSON.parse(data);
                    display.textContent = JSON.stringify(coupons, null, 2);
                    showStatus(`✅ クーポンデータを表示しました (${Object.keys(coupons).length}件)`, 'success');
                } catch (error) {
                    display.textContent = 'データの解析エラー: ' + error.message;
                    showStatus('❌ データ解析エラー', 'error');
                }
            } else {
                display.textContent = 'クーポンデータが見つかりません';
                showStatus('⚠️ クーポンデータがありません', 'error');
            }
        }

        function showIntegratedData() {
            const data = localStorage.getItem('salon_integrated_admin');
            const display = document.getElementById('integrated-data');
            
            if (data) {
                try {
                    const integrated = JSON.parse(data);
                    display.textContent = JSON.stringify(integrated, null, 2);
                    showStatus('✅ 統合管理データを表示しました', 'success');
                } catch (error) {
                    display.textContent = 'データの解析エラー: ' + error.message;
                    showStatus('❌ データ解析エラー', 'error');
                }
            } else {
                display.textContent = '統合管理データが見つかりません';
                showStatus('⚠️ 統合管理データがありません', 'error');
            }
        }

        function createTestCoupons() {
            const testCoupons = {
                'LINE500': {
                    code: 'LINE500',
                    discountType: 'fixed',
                    discountValue: 500,
                    maxUses: 100,
                    currentUses: 0,
                    expiryDate: '2024-12-31',
                    applicableServices: ['all'],
                    isActive: true,
                    createdAt: new Date().toISOString()
                },
                'MONITOR100': {
                    code: 'MONITOR100',
                    discountType: 'percentage',
                    discountValue: 100,
                    maxUses: 10,
                    currentUses: 0,
                    expiryDate: '2024-12-31',
                    applicableServices: ['shintaku'],
                    isActive: true,
                    createdAt: new Date().toISOString()
                },
                'THANKS20': {
                    code: 'THANKS20',
                    discountType: 'percentage',
                    discountValue: 20,
                    maxUses: 50,
                    currentUses: 0,
                    expiryDate: '2025-03-31',
                    applicableServices: ['personal_tarot', 'personal_birthday'],
                    isActive: true,
                    createdAt: new Date().toISOString()
                }
            };
            
            localStorage.setItem('salon_coupons', JSON.stringify(testCoupons));
            showStatus('✅ テストクーポンを3件作成しました', 'success');
            showCouponData();
        }

        function clearAllData() {
            if (confirm('本当に全てのデータを削除しますか？')) {
                localStorage.removeItem('salon_coupons');
                localStorage.removeItem('salon_integrated_admin');
                localStorage.removeItem('salon_coupon_usage');
                
                document.getElementById('coupon-data').textContent = '';
                document.getElementById('integrated-data').textContent = '';
                document.getElementById('test-results').textContent = '';
                
                showStatus('🗑️ 全データをクリアしました', 'info');
            }
        }

        function exportCouponData() {
            const data = localStorage.getItem('salon_coupons');
            if (data) {
                const blob = new Blob([data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `salon_coupons_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showStatus('📥 クーポンデータをエクスポートしました', 'success');
            } else {
                showStatus('❌ エクスポートするデータがありません', 'error');
            }
        }

        function syncDataSystems() {
            console.log('🔄 syncDataSystems 関数が呼び出されました');
            alert('データ同期テストを開始します'); // 確認用
            
            const testResults = document.getElementById('test-results');
            console.log('test-results 要素:', testResults);
            
            if (!testResults) {
                alert('test-results 要素が見つかりません');
                return;
            }
            
            testResults.textContent = '🔄 詳細データ分析開始...\n\n';
            
            try {
                // 進行状況を表示に追加
                testResults.textContent += '📍 Step 0: 処理開始確認 ✅\n';
                console.log('処理開始確認 OK');
                
                // 1. クーポンデータ詳細分析
                testResults.textContent += '📍 Step 1: localStorage アクセス中...\n';
                console.log('localStorage アクセス中...');
                
                const couponData = localStorage.getItem('salon_coupons');
                console.log('localStorage.getItem 結果:', couponData);
                
                testResults.textContent += `📊 Step 1: クーポンデータ詳細分析\n`;
                testResults.textContent += `- データ存在: ${couponData ? '✅' : '❌'}\n`;
                
                if (couponData) {
                    testResults.textContent += `- データサイズ: ${couponData.length} 文字\n`;
                    testResults.textContent += `- RAWデータ先頭: ${couponData.substring(0, 100)}...\n\n`;
                    
                    alert('Step 1完了: クーポンデータが見つかりました！次はJSON解析を行います');
                    
                    try {
                        testResults.textContent += '📍 Step 2: JSON解析中...\n';
                        console.log('🔍 JSON解析を試行中...');
                        console.log('RAWデータ内容（最初の500文字）:', couponData.substring(0, 500));
                        
                        // データの基本チェック
                        if (couponData.trim() === '') {
                            throw new Error('データが空です');
                        }
                        
                        if (!couponData.startsWith('{') && !couponData.startsWith('[')) {
                            throw new Error('有効なJSONフォーマットではありません（{または[で始まっていません）');
                        }
                        
                        testResults.textContent += '📍 Step 2-1: データ形式チェック完了 ✅\n';
                        
                        const coupons = JSON.parse(couponData);
                        
                        alert('JSON解析成功しました！');
                        testResults.textContent += `- JSON解析: ✅\n`;
                        testResults.textContent += `- データ型: ${typeof coupons}\n`;
                        testResults.textContent += `- 配列判定: ${Array.isArray(coupons)}\n`;
                        
                        let couponArray = [];
                        if (Array.isArray(coupons)) {
                            couponArray = coupons;
                            testResults.textContent += `- 配列形式 - 要素数: ${coupons.length}\n`;
                        } else if (typeof coupons === 'object' && coupons !== null) {
                            couponArray = Object.values(coupons);
                            testResults.textContent += `- オブジェクト形式 - キー数: ${Object.keys(coupons).length}\n`;
                            testResults.textContent += `- キー一覧: ${Object.keys(coupons).join(', ')}\n`;
                        }
                        
                        testResults.textContent += `\n📋 各クーポン詳細分析:\n`;
                        couponArray.forEach((coupon, index) => {
                            testResults.textContent += `[${index + 1}] `;
                            if (coupon && typeof coupon === 'object') {
                                const code = coupon.code || '(コード不明)';
                                const type = coupon.discountType || '(型不明)';
                                const value = coupon.discountValue || '(値不明)';
                                const active = coupon.isActive !== undefined ? coupon.isActive : coupon.active;
                                testResults.textContent += `${code} - ${type} ${value} - 有効:${active}\n`;
                                
                                // 必須フィールドチェック
                                const missing = [];
                                if (!coupon.code) missing.push('code');
                                if (!coupon.discountType) missing.push('discountType');
                                if (coupon.discountValue === undefined) missing.push('discountValue');
                                
                                if (missing.length > 0) {
                                    testResults.textContent += `    ⚠️ 不足フィールド: ${missing.join(', ')}\n`;
                                }
                            } else {
                                testResults.textContent += `❌ 無効なオブジェクト: ${typeof coupon}\n`;
                            }
                        });
                        
                        // 2. 統合管理データとの同期テスト
                        testResults.textContent += `\n📊 Step 2: 統合管理データ分析\n`;
                        const integratedData = localStorage.getItem('salon_integrated_admin');
                        if (integratedData) {
                            const integrated = JSON.parse(integratedData);
                            testResults.textContent += `- 統合管理データ: ✅\n`;
                            testResults.textContent += `- 価格ルール数: ${integrated.pricingRules ? integrated.pricingRules.length : 0}件\n`;
                            testResults.textContent += `- 商品数: ${integrated.products ? integrated.products.length : 0}件\n`;
                        } else {
                            testResults.textContent += `- 統合管理データ: ❌\n`;
                        }
                        
                        // 3. 連携シミュレーション
                        testResults.textContent += `\n📊 Step 3: 連携シミュレーション\n`;
                        let simulationSuccess = 0;
                        let simulationError = 0;
                        
                        couponArray.forEach((coupon, index) => {
                            try {
                                if (!coupon || !coupon.code) {
                                    throw new Error('無効なクーポンデータ');
                                }
                                
                                const discountText = (coupon.discountType === 'percentage') 
                                    ? `${coupon.discountValue}% OFF` 
                                    : `¥${coupon.discountValue} OFF`;
                                
                                testResults.textContent += `  ✅ [${index + 1}] ${coupon.code} - ${discountText}\n`;
                                simulationSuccess++;
                            } catch (simError) {
                                testResults.textContent += `  ❌ [${index + 1}] エラー: ${simError.message}\n`;
                                simulationError++;
                            }
                        });
                        
                        testResults.textContent += `\n📊 シミュレーション結果:\n`;
                        testResults.textContent += `- 成功: ${simulationSuccess}件\n`;
                        testResults.textContent += `- エラー: ${simulationError}件\n`;
                        
                        if (simulationSuccess > 0) {
                            showStatus(`✅ 分析完了: ${simulationSuccess}件のクーポンが利用可能`, 'success');
                        } else {
                            showStatus('❌ 利用可能なクーポンがありません', 'error');
                        }
                        
                    } catch (parseError) {
                        alert(`JSON解析エラーが発生しました: ${parseError.message}`);
                        testResults.textContent += `- JSON解析: ❌\n`;
                        testResults.textContent += `- エラー: ${parseError.message}\n`;
                        testResults.textContent += `- エラー詳細: ${parseError.toString()}\n`;
                        console.error('JSON解析エラー詳細:', parseError);
                        console.error('問題のデータ:', couponData);
                        showStatus('❌ JSON解析エラー', 'error');
                    }
                } else {
                    testResults.textContent += '\n❌ クーポンデータがないため分析を中止\n';
                    testResults.textContent += '\n💡 解決策: 「テストクーポン作成」ボタンを押してください\n';
                    alert('クーポンデータが見つかりませんでした。まず「テストクーポン作成」ボタンを押してください');
                    showStatus('❌ クーポンデータがありません', 'error');
                }
                
            } catch (error) {
                testResults.textContent += `\n❌ 分析エラー: ${error.message}\n`;
                showStatus('❌ 分析でエラーが発生', 'error');
            }
        }

        function testDataFlow() {
            const testResults = document.getElementById('test-results');
            testResults.textContent = '🔬 データ連携テスト開始...\n\n';
            
            // Step 1: クーポンデータ読み込みテスト
            testResults.textContent += '📋 Step 1: クーポンデータ読み込み\n';
            try {
                const existingCoupons = localStorage.getItem('salon_coupons');
                if (existingCoupons) {
                    const coupons = JSON.parse(existingCoupons);
                    testResults.textContent += `✅ 成功: ${Object.keys(coupons).length}件のクーポンを読み込み\n\n`;
                    
                    // Step 2: データ変換テスト
                    testResults.textContent += '🔄 Step 2: データ変換テスト\n';
                    Object.values(coupons).forEach(coupon => {
                        const discountText = coupon.discountType === 'percentage' 
                            ? `${coupon.discountValue}% OFF` 
                            : `¥${coupon.discountValue} OFF`;
                        testResults.textContent += `  - ${coupon.code}: ${discountText} (${coupon.isActive ? '有効' : '無効'})\n`;
                    });
                    testResults.textContent += '✅ データ変換成功\n\n';
                    
                    // Step 3: 統合管理画面での読み込みシミュレーション
                    testResults.textContent += '🎛️ Step 3: 統合管理画面連携シミュレーション\n';
                    const selectHTML = '<select>\n';
                    Object.values(coupons).forEach(coupon => {
                        const discountText = coupon.discountType === 'percentage' 
                            ? `${coupon.discountValue}% OFF` 
                            : `¥${coupon.discountValue} OFF`;
                        testResults.textContent += `  <option value="${coupon.code}">${coupon.code} - ${discountText}</option>\n`;
                    });
                    testResults.textContent += '</select>\n✅ HTML生成成功\n\n';
                    
                    showStatus('✅ 全てのテストが成功しました', 'success');
                } else {
                    testResults.textContent += '❌ 失敗: クーポンデータが見つかりません\n';
                    testResults.textContent += '\n💡 解決策: 「テストクーポン作成」ボタンを押してください\n';
                    showStatus('❌ クーポンデータがありません', 'error');
                }
            } catch (error) {
                testResults.textContent += `❌ エラー: ${error.message}\n`;
                showStatus('❌ テストでエラーが発生', 'error');
            }
        }

        function openUltimateAdmin() {
            window.open('ultimate-admin.html', '_blank');
        }

        function openIntegratedAdmin() {
            window.open('integrated-admin.html', '_blank');
        }

        // ページ読み込み時に自動確認
        window.addEventListener('DOMContentLoaded', function() {
            checkAllData();
        });
    </script>
</body>
</html>
