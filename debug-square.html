<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Square デバッグ - Salon de Serafina</title>
    
    <!-- Square Web Payments SDK -->
    <script type="application/javascript" src="https://sandbox.web.squarecdn.com/v1/square.js"></script>
    
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #1a0033;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        
        .debug-container {
            max-width: 1000px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
        }
        
        .debug-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }
        
        .debug-section h3 {
            color: #ffd700;
            margin-bottom: 15px;
        }
        
        .status-ok {
            color: #4caf50;
        }
        
        .status-error {
            color: #f44336;
        }
        
        .status-warning {
            color: #ffc107;
        }
        
        .btn {
            background: linear-gradient(45deg, #4caf50, #66bb6a);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .log-output {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }
        
        .test-card-form {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        #card-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            min-height: 120px;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔍 Square デバッグツール</h1>
        <p>Square決済システムの詳細な診断とテスト</p>
        
        <!-- 1. システム確認 -->
        <div class="debug-section">
            <h3>📋 1. システム確認</h3>
            <div id="system-status">初期化中...</div>
        </div>
        
        <!-- 2. 設定確認 -->
        <div class="debug-section">
            <h3>⚙️ 2. 設定確認</h3>
            <div id="config-status">確認中...</div>
        </div>
        
        <!-- 3. Square SDK確認 -->
        <div class="debug-section">
            <h3>🏦 3. Square SDK確認</h3>
            <div id="square-status">確認中...</div>
            <button class="btn" onclick="testSquareInitialization()">Square初期化テスト</button>
        </div>
        
        <!-- 4. カード決済フォーム -->
        <div class="debug-section">
            <h3>💳 4. カード決済フォームテスト</h3>
            <div class="test-card-form">
                <p>テスト用カード番号: <strong>4111 1111 1111 1111</strong></p>
                <p>CVV: <strong>123</strong> | 有効期限: <strong>12/25</strong></p>
                <div id="card-container"></div>
                <button class="btn" onclick="testCardTokenization()">カードトークン化テスト</button>
            </div>
        </div>
        
        <!-- 5. クーポンシステム -->
        <div class="debug-section">
            <h3>🎫 5. クーポンシステム</h3>
            <div id="coupon-status">確認中...</div>
            <button class="btn" onclick="testCouponSystem()">クーポンテスト</button>
        </div>
        
        <!-- 6. ログ出力 -->
        <div class="debug-section">
            <h3>📝 6. デバッグログ</h3>
            <div class="log-output" id="debug-log"></div>
            <button class="btn" onclick="clearLog()">ログクリア</button>
        </div>
        
        <!-- 7. 完全テスト -->
        <div class="debug-section">
            <h3>🧪 7. 完全統合テスト</h3>
            <button class="btn" onclick="runFullTest()">全機能テスト実行</button>
        </div>
    </div>

    <!-- スクリプト読み込み -->
    <script src="js/square-config.js"></script>
    <script src="js/coupon-system.js"></script>
    <script src="js/square-payment.js"></script>

    <script>
        let debugLog = [];
        let squarePayment = null;
        
        // ページロード時の診断
        document.addEventListener('DOMContentLoaded', function() {
            log('🔍 デバッグツール開始', 'info');
            runSystemDiagnostics();
        });
        
        // システム診断
        function runSystemDiagnostics() {
            log('📋 システム診断開始...', 'info');
            
            // 1. システム確認
            checkSystem();
            
            // 2. 設定確認
            checkConfig();
            
            // 3. Square SDK確認
            checkSquareSDK();
            
            // 4. クーポンシステム確認
            checkCouponSystem();
        }
        
        // 1. システム確認
        function checkSystem() {
            const systemStatus = document.getElementById('system-status');
            let status = '';
            
            // ブラウザ確認
            status += `🌐 ブラウザ: ${navigator.userAgent.split(' ').pop()}<br>`;
            status += `📍 URL: ${window.location.href}<br>`;
            status += `🔒 HTTPS: ${location.protocol === 'https:' ? '✅' : '❌'}<br>`;
            
            // JavaScript確認
            status += `⚡ JavaScript: ✅ 有効<br>`;
            status += `📦 LocalStorage: ${typeof Storage !== 'undefined' ? '✅' : '❌'}<br>`;
            
            systemStatus.innerHTML = status;
        }
        
        // 2. 設定確認
        function checkConfig() {
            const configStatus = document.getElementById('config-status');
            let status = '';
            
            try {
                if (typeof SquareConfig === 'undefined') {
                    status += `❌ SquareConfig が読み込まれていません<br>`;
                    log('❌ SquareConfig 未定義', 'error');
                } else {
                    const config = SquareConfig.getCurrentConfig();
                    status += `✅ SquareConfig 読み込み完了<br>`;
                    status += `🔧 環境: <span class="status-ok">${config.environment}</span><br>`;
                    status += `🆔 Application ID: <code>${config.applicationId}</code><br>`;
                    status += `📍 Location ID: <code>${config.locationId}</code><br>`;
                    
                    // 設定検証
                    const validation = SquareConfig.validateConfig();
                    if (validation.valid) {
                        status += `✅ 設定検証: <span class="status-ok">正常</span><br>`;
                        log('✅ Square設定検証成功', 'info');
                    } else {
                        status += `❌ 設定検証: <span class="status-error">${validation.issues.join(', ')}</span><br>`;
                        log('❌ Square設定検証失敗: ' + validation.issues.join(', '), 'error');
                    }
                }
            } catch (error) {
                status += `❌ 設定確認エラー: ${error.message}<br>`;
                log('❌ 設定確認エラー: ' + error.message, 'error');
            }
            
            configStatus.innerHTML = status;
        }
        
        // 3. Square SDK確認
        function checkSquareSDK() {
            const squareStatus = document.getElementById('square-status');
            let status = '';
            
            if (typeof Square === 'undefined') {
                status += `❌ Square Web Payments SDK が読み込まれていません<br>`;
                status += `📍 URL確認: https://sandbox.web.squarecdn.com/v1/square.js<br>`;
                log('❌ Square SDK 未定義', 'error');
            } else {
                status += `✅ Square Web Payments SDK 読み込み完了<br>`;
                status += `📦 Square オブジェクト: 利用可能<br>`;
                log('✅ Square SDK 読み込み完了', 'info');
                
                // Square.paymentsが利用可能か確認
                if (typeof Square.payments === 'function') {
                    status += `✅ Square.payments: 利用可能<br>`;
                    log('✅ Square.payments 利用可能', 'info');
                } else {
                    status += `❌ Square.payments: 利用不可<br>`;
                    log('❌ Square.payments 利用不可', 'error');
                }
            }
            
            squareStatus.innerHTML = status;
        }
        
        // 4. クーポンシステム確認
        function checkCouponSystem() {
            const couponStatus = document.getElementById('coupon-status');
            let status = '';
            
            if (typeof window.couponSystem === 'undefined') {
                status += `❌ クーポンシステムが読み込まれていません<br>`;
                log('❌ クーポンシステム 未定義', 'error');
            } else {
                status += `✅ クーポンシステム 読み込み完了<br>`;
                
                try {
                    const coupons = window.couponSystem.getAllCoupons();
                    status += `📊 登録クーポン数: ${coupons.length}<br>`;
                    log(`✅ クーポンシステム: ${coupons.length}個のクーポン`, 'info');
                } catch (error) {
                    status += `⚠️ クーポン取得エラー: ${error.message}<br>`;
                    log('⚠️ クーポン取得エラー: ' + error.message, 'warning');
                }
            }
            
            couponStatus.innerHTML = status;
        }
        
        // Square初期化テスト
        async function testSquareInitialization() {
            log('🧪 Square初期化テスト開始...', 'info');
            
            try {
                if (typeof SquareConfig === 'undefined') {
                    throw new Error('SquareConfig が見つかりません');
                }
                
                if (typeof Square === 'undefined') {
                    throw new Error('Square SDK が読み込まれていません');
                }
                
                const config = SquareConfig.getCurrentConfig();
                log(`🔧 使用設定: ${JSON.stringify(config, null, 2)}`, 'info');
                
                // SquareCouponPaymentクラスのテスト
                squarePayment = new SquareCouponPayment();
                log('✅ SquareCouponPayment インスタンス作成成功', 'info');
                
                const initialized = await squarePayment.initializeSquare();
                
                if (initialized) {
                    log('✅ Square初期化テスト成功！', 'success');
                    
                    // カード初期化テスト
                    if (squarePayment.card) {
                        log('✅ カード決済フォーム初期化成功', 'success');
                    } else {
                        log('⚠️ カード決済フォームが初期化されていません', 'warning');
                    }
                    
                } else {
                    log('❌ Square初期化テスト失敗', 'error');
                }
                
            } catch (error) {
                log('❌ Square初期化テストエラー: ' + error.message, 'error');
                console.error('Square初期化エラー詳細:', error);
            }
        }
        
        // カードトークン化テスト
        async function testCardTokenization() {
            log('🧪 カードトークン化テスト開始...', 'info');
            
            if (!squarePayment || !squarePayment.isInitialized) {
                log('❌ Square決済システムが初期化されていません', 'error');
                return;
            }
            
            try {
                const result = await squarePayment.card.tokenize();
                
                if (result.status === 'OK') {
                    log('✅ カードトークン化成功！', 'success');
                    log(`🔑 トークン: ${result.token}`, 'info');
                } else {
                    log('❌ カードトークン化失敗', 'error');
                    log(`エラー: ${JSON.stringify(result.errors)}`, 'error');
                }
                
            } catch (error) {
                log('❌ カードトークン化エラー: ' + error.message, 'error');
            }
        }
        
        // クーポンテスト
        function testCouponSystem() {
            log('🧪 クーポンシステムテスト開始...', 'info');
            
            if (!window.couponSystem) {
                log('❌ クーポンシステムが利用できません', 'error');
                return;
            }
            
            try {
                // テスト用クーポンコードで検証
                const testCode = 'TEST500';
                const validation = window.couponSystem.validateCoupon(
                    testCode,
                    'shintaku',
                    3000,
                    'test@example.com'
                );
                
                if (validation.valid) {
                    log(`✅ クーポン検証成功: ${testCode}`, 'success');
                    log(`💰 割引額: ${validation.discountAmount}円`, 'info');
                    log(`💳 最終価格: ${validation.finalPrice}円`, 'info');
                } else {
                    log(`❌ クーポン検証失敗: ${validation.error}`, 'error');
                }
                
            } catch (error) {
                log('❌ クーポンテストエラー: ' + error.message, 'error');
            }
        }
        
        // 完全統合テスト
        async function runFullTest() {
            log('🧪 完全統合テスト開始...', 'info');
            
            // 1. 全システム初期化
            await testSquareInitialization();
            
            // 2. クーポンシステムテスト
            testCouponSystem();
            
            // 3. 統合テスト
            if (squarePayment && squarePayment.isInitialized && window.couponSystem) {
                log('✅ 全システム正常動作確認！', 'success');
                log('🎉 決済ページでのテストが可能です', 'success');
            } else {
                log('❌ 一部システムに問題があります', 'error');
            }
        }
        
        // ログ追加
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            
            debugLog.push({ message: logEntry, type });
            updateLogDisplay();
            
            // コンソールにも出力
            console.log(logEntry);
        }
        
        // ログ表示更新
        function updateLogDisplay() {
            const logContainer = document.getElementById('debug-log');
            const displayLogs = debugLog.slice(-50); // 最新50件
            
            logContainer.innerHTML = displayLogs
                .map(log => `<div class="log-${log.type}">${log.message}</div>`)
                .join('');
            
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        // ログクリア
        function clearLog() {
            debugLog = [];
            updateLogDisplay();
            log('🧹 ログクリア完了', 'info');
        }
        
        console.log('🔍 Square Debug Tool initialized');
    </script>
</body>
</html>
