<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者専用ページ - Salon de Serafina</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0033, #4a0080, #6a0dad);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .admin-portal {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 500px;
        }
        
        .admin-portal h1 {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .admin-links {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }
        
        .admin-link {
            display: block;
            padding: 15px 25px;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.1em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .admin-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }
        
        .warning {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 0.9em;
        }
        
        .back-link {
            margin-top: 30px;
        }
        
        .back-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9em;
        }
        
        .back-link a:hover {
            color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="admin-portal">
        <h1>🛠️ 管理者ポータル</h1>
        <p>Salon de Serafina の管理機能にアクセスできます</p>
        
        <div class="warning">
            ⚠️ <strong>管理者専用ページです</strong><br>
            このページはお客様には表示されません
        </div>
        
        <div class="admin-links">
            <a href="admin/coupon-admin.html" class="admin-link">
                🎫 クーポン管理システム
            </a>
            
            <a href="demo/coupon-demo.html" class="admin-link">
                🧪 クーポンテストページ
            </a>
            
            <a href="omikuji/index.html" class="admin-link">
                🏠 サイトトップページ
            </a>
        </div>
        
        <div class="back-link">
            <a href="omikuji/index.html">← トップページに戻る</a>
        </div>
        
        <div style="margin-top: 40px; font-size: 0.8em; color: rgba(255,255,255,0.5);">
            <p>🔐 このページの URL: manage.html</p>
            <p>📝 ブックマークしておくと便利です</p>
        </div>
    </div>
    
    <script>
        console.log('🛠️ 管理者ポータルページが読み込まれました');
        console.log('📍 このページの URL をブックマークしてください: manage.html');
        
        // セキュリティ警告
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
            console.warn('⚠️ 本番環境では、このページへのアクセスを制限することを強く推奨します');
        }
    </script>
</body>
</html>
