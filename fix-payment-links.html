<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決済リンク修正ツール</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #0056b3;
        }
        .success {
            background: #28a745;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        .warning {
            background: #ffc107;
            color: #212529;
            padding: 15px;
            border-radius: 5px;
            margin: 15px 0;
        }
        pre {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Salon de Serafina 決済リンク修正ツール</h1>
        
        <div class="warning">
            <strong>⚠️ 注意:</strong> このツールは統合管理画面のlocalStorageデータを直接修正します。
        </div>
        
        <button onclick="checkCurrentData()">📊 現在のデータを確認</button>
        <button onclick="fixPaymentLinks()">🔧 決済リンクを修正</button>
        <button onclick="clearAllData()">🗑️ 全データを削除（初期化）</button>
        
        <div id="result"></div>
    </div>

    <script>
        function checkCurrentData() {
            const adminData = localStorage.getItem('salon_integrated_admin');
            const resultDiv = document.getElementById('result');
            
            if (!adminData) {
                resultDiv.innerHTML = '<div class="warning">❌ 統合管理画面のデータが見つかりません</div>';
                return;
            }
            
            try {
                const data = JSON.parse(adminData);
                resultDiv.innerHTML = `
                    <div class="success">✅ データ確認完了</div>
                    <h3>決済リンク一覧:</h3>
                    <pre>${JSON.stringify(data.paymentLinks, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<div class="warning">❌ データ解析エラー: ${error.message}</div>`;
            }
        }
        
        function fixPaymentLinks() {
            const adminData = localStorage.getItem('salon_integrated_admin');
            const resultDiv = document.getElementById('result');
            
            if (!adminData) {
                resultDiv.innerHTML = '<div class="warning">❌ 統合管理画面のデータが見つかりません。まず統合管理画面で初期化してください。</div>';
                return;
            }
            
            try {
                const data = JSON.parse(adminData);
                
                // 正しいSquareリンクに修正
                const correctLinks = {
                    'shintaku': 'https://square.link/u/SwNECrMb',
                    'star_yomi': 'https://square.link/u/7XZ2ip4k',
                    'personal_tarot': 'https://square.link/u/pr9IPpWD',
                    'personal_birthday': 'https://square.link/u/og2lry9q',
                    'personal_set': 'https://square.link/u/KFP9scSR'
                };
                
                if (data.paymentLinks) {
                    data.paymentLinks.forEach(link => {
                        const correctUrl = correctLinks[link.productId];
                        if (correctUrl) {
                            const oldUrl = link.url;
                            link.url = correctUrl;
                            link.active = true;
                            console.log(`🔧 ${link.productId}: ${oldUrl} → ${correctUrl}`);
                        }
                    });
                    
                    // データを保存
                    localStorage.setItem('salon_integrated_admin', JSON.stringify(data));
                    
                    resultDiv.innerHTML = `
                        <div class="success">✅ 決済リンク修正完了！</div>
                        <p>修正された決済リンク:</p>
                        <ul>
                            <li>神託システム: https://square.link/u/SwNECrMb</li>
                            <li>星詠みシステム: https://square.link/u/7XZ2ip4k</li>
                            <li>個人鑑定タロット: https://square.link/u/pr9IPpWD</li>
                            <li>個人鑑定誕生日: https://square.link/u/og2lry9q</li>
                            <li>個人鑑定セット: https://square.link/u/KFP9scSR</li>
                        </ul>
                        <p><strong>今すぐページを再読み込みして確認してください！</strong></p>
                    `;
                } else {
                    resultDiv.innerHTML = '<div class="warning">❌ 決済リンクデータが見つかりません</div>';
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="warning">❌ 修正エラー: ${error.message}</div>`;
            }
        }
        
        function clearAllData() {
            if (confirm('本当に全データを削除しますか？（この操作は取り消せません）')) {
                localStorage.removeItem('salon_integrated_admin');
                localStorage.removeItem('salon_coupons');
                localStorage.removeItem('salon_coupon_usage');
                
                document.getElementById('result').innerHTML = `
                    <div class="success">✅ 全データを削除しました</div>
                    <p>統合管理画面にアクセスして「データ初期化」ボタンを押し、新しいデータを作成してください。</p>
                `;
            }
        }
        
        // ページ読み込み時に自動でデータチェック
        window.addEventListener('DOMContentLoaded', function() {
            checkCurrentData();
        });
    </script>
</body>
</html>
