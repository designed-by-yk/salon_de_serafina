<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完全動作版クーポン管理 - Salon de Serafina</title>
    
    <!-- クーポンシステム -->
    <script src="js/coupon-system.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .admin-header h1 {
            color: #ffd700;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            color: #ffd700;
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 16px;
            margin: 5px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff4757, #ff6b6b);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .coupon-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .coupon-item:hover {
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
        }

        .coupon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .coupon-code {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .coupon-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .status-expired {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }

        .status-used-up {
            background: rgba(156, 39, 176, 0.3);
            color: #9c27b0;
        }

        .status-inactive {
            background: rgba(158, 158, 158, 0.3);
            color: #9e9e9e;
        }

        .coupon-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .coupon-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }

        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a0033, #2d1b69);
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #ffd700;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th,
        .history-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .history-table th {
            background: rgba(255, 255, 255, 0.1);
            color: #ffd700;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .coupon-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .coupon-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🎫 完全動作版クーポン管理</h1>
            <p>Salon de Serafina - 管理者画面</p>
        </div>

        <!-- 統計情報 -->
        <div class="admin-section">
            <h2 class="section-title">📊 統計情報</h2>
            <div id="stats-container" class="stats-grid">
                <!-- 統計データがここに表示されます -->
            </div>
        </div>

        <!-- クイックアクション -->
        <div class="admin-section">
            <h2 class="section-title">⚡ クイックアクション</h2>
            <div class="quick-actions">
                <button class="btn btn-primary" onclick="AdminSystem.createQuickCoupon('LINE特典')">
                    📱 LINE特典クーポン
                </button>
                <button class="btn btn-primary" onclick="AdminSystem.createQuickCoupon('モニター')">
                    🎯 モニター用クーポン
                </button>
                <button class="btn btn-primary" onclick="AdminSystem.createQuickCoupon('新規お客様')">
                    ✨ 新規お客様特典
                </button>
                <button class="btn btn-secondary" onclick="AdminSystem.generateRandomCoupon()">
                    🎲 ランダムクーポン生成
                </button>
            </div>
        </div>

        <!-- クーポン作成フォーム -->
        <div class="admin-section">
            <h2 class="section-title">➕ 新規クーポン作成</h2>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="coupon-code">クーポンコード *</label>
                    <input type="text" id="coupon-code" placeholder="例: WELCOME2024">
                </div>
                <div class="form-group">
                    <label for="coupon-description">説明</label>
                    <input type="text" id="coupon-description" placeholder="例: 新規お客様特典">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="discount-type">割引タイプ *</label>
                    <select id="discount-type" onchange="AdminSystem.updateDiscountInput()">
                        <option value="">選択してください</option>
                        <option value="percentage">パーセント割引</option>
                        <option value="fixed">固定金額割引</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="discount-value">割引値 *</label>
                    <input type="number" id="discount-value" placeholder="例: 500">
                    <small id="discount-unit" style="color: rgba(255,255,255,0.7);"></small>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="max-uses">最大使用回数</label>
                    <input type="number" id="max-uses" value="1" min="1" placeholder="例: 5">
                </div>
                <div class="form-group">
                    <label for="expiry-type">有効期限タイプ</label>
                    <select id="expiry-type" onchange="AdminSystem.updateExpiryInput()">
                        <option value="date">指定日まで</option>
                        <option value="one_year">発行から1年間有効</option>
                        <option value="unlimited">無期限</option>
                    </select>
                </div>
            </div>

            <div class="form-group" id="expiry-date-group">
                <label for="expiry-date">有効期限</label>
                <input type="date" id="expiry-date">
            </div>

            <div class="form-group">
                <label>適用可能サービス *</label>
                <div id="services-checkboxes" class="checkbox-group">
                    <!-- サービスチェックボックスがここに生成されます -->
                </div>
            </div>

            <div style="display: flex; gap: 15px; margin-top: 30px;">
                <button class="btn btn-primary" onclick="AdminSystem.createCoupon()">
                    ➕ クーポンを作成
                </button>
                <button class="btn btn-secondary" onclick="AdminSystem.resetForm()">
                    🔄 フォームリセット
                </button>
            </div>
        </div>

        <!-- クーポン一覧 -->
        <div class="admin-section">
            <h2 class="section-title">📋 クーポン一覧</h2>
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button onclick="AdminSystem.loadCoupons()" class="btn btn-secondary">
                    🔄 更新
                </button>
                <button onclick="AdminSystem.bulkDeleteExpired()" class="btn btn-danger">
                    🗑️ 期限切れ一括削除
                </button>
                <button onclick="AdminSystem.exportData()" class="btn btn-secondary">
                    📊 データエクスポート
                </button>
            </div>
            <div id="coupons-list">
                <!-- クーポン一覧がここに表示されます -->
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>✏️ クーポン編集</h2>
                <button class="close-btn" onclick="AdminSystem.closeEditModal()">×</button>
            </div>
            <div id="edit-form-content">
                <!-- 編集フォームがここに動的に生成されます -->
            </div>
        </div>
    </div>

    <!-- 使用履歴モーダル -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 使用履歴</h2>
                <button class="close-btn" onclick="AdminSystem.closeHistoryModal()">×</button>
            </div>
            <div id="history-content">
                <!-- 使用履歴がここに表示されます -->
            </div>
        </div>
    </div>

    <script>
        // グローバルな管理システム
        window.AdminSystem = {
            couponSystem: null,
            currentEditingCode: null,

            // 初期化
            init: function() {
                console.log('🚀 AdminSystemを初期化中...');
                
                // エラーハンドリング
                window.addEventListener('error', (e) => {
                    console.error('❌ JavaScript エラー:', e.error);
                    this.showMessage('システムエラーが発生しました', 'error');
                });

                // couponSystemの初期化
                if (window.couponSystem) {
                    this.couponSystem = window.couponSystem;
                    console.log('✅ 既存のcouponSystemを使用');
                } else if (window.CouponSystem) {
                    console.log('🔧 新しいCouponSystemインスタンスを作成');
                    this.couponSystem = new window.CouponSystem();
                    window.couponSystem = this.couponSystem;
                } else {
                    console.error('❌ CouponSystemクラスが見つかりません');
                    this.showMessage('クーポンシステムの初期化に失敗しました', 'error');
                    return;
                }

                console.log('📊 使用するcouponSystem:', this.couponSystem);
                
                // UI初期化
                this.initializeUI();
                this.loadCoupons();
                this.loadStats();
                this.updateExpiryInput();
                
                console.log('✅ AdminSystem初期化完了');
            },

            // UI初期化
            initializeUI: function() {
                console.log('🎨 UI初期化中...');
                
                const servicesContainer = document.getElementById('services-checkboxes');
                const services = this.couponSystem.serviceTypes;
                
                servicesContainer.innerHTML = '';
                Object.entries(services).forEach(([key, name]) => {
                    const checkboxItem = document.createElement('div');
                    checkboxItem.className = 'checkbox-item';
                    checkboxItem.innerHTML = `
                        <input type="checkbox" id="service-${key}" value="${key}">
                        <label for="service-${key}">${name}</label>
                    `;
                    servicesContainer.appendChild(checkboxItem);
                });

                console.log('✅ UI初期化完了');
            },

            // メッセージ表示
            showMessage: function(message, type) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message message-${type}`;
                messageDiv.textContent = message;
                
                const container = document.querySelector('.admin-section');
                container.insertBefore(messageDiv, container.firstChild);
                
                setTimeout(() => {
                    messageDiv.remove();
                }, 5000);
            },

            // フォーム関連
            updateDiscountInput: function() {
                const discountType = document.getElementById('discount-type').value;
                const unitSpan = document.getElementById('discount-unit');
                
                if (discountType === 'percentage') {
                    unitSpan.textContent = '% (例: 20 = 20%OFF)';
                } else if (discountType === 'fixed') {
                    unitSpan.textContent = '円 (例: 500 = 500円OFF)';
                } else {
                    unitSpan.textContent = '';
                }
            },

            updateExpiryInput: function() {
                const expiryType = document.getElementById('expiry-type').value;
                const expiryDateGroup = document.getElementById('expiry-date-group');
                
                if (expiryType === 'date') {
                    expiryDateGroup.style.display = 'block';
                } else {
                    expiryDateGroup.style.display = 'none';
                }
            },

            resetForm: function() {
                document.getElementById('coupon-code').value = '';
                document.getElementById('coupon-description').value = '';
                document.getElementById('discount-type').value = '';
                document.getElementById('discount-value').value = '';
                document.getElementById('max-uses').value = '1';
                document.getElementById('expiry-type').value = 'date';
                document.getElementById('expiry-date').value = '';
                document.getElementById('discount-unit').textContent = '';
                
                document.querySelectorAll('#services-checkboxes input[type="checkbox"]').forEach(checkbox => {
                    checkbox.checked = false;
                });
                
                this.updateExpiryInput();
                console.log('📝 フォームをリセットしました');
            },

            // クーポン作成
            createCoupon: function() {
                console.log('🔧 クーポン作成開始...');
                
                const code = document.getElementById('coupon-code').value.trim().toUpperCase();
                const description = document.getElementById('coupon-description').value.trim();
                const discountType = document.getElementById('discount-type').value;
                const discountValue = parseFloat(document.getElementById('discount-value').value);
                const maxUses = parseInt(document.getElementById('max-uses').value) || 1;
                const expiryType = document.getElementById('expiry-type').value;
                
                // 有効期限の設定
                let expiryDate = null;
                if (expiryType === 'date') {
                    expiryDate = document.getElementById('expiry-date').value;
                } else if (expiryType === 'one_year') {
                    const oneYearLater = new Date();
                    oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                    expiryDate = oneYearLater.toISOString().split('T')[0];
                }

                // 適用可能サービスを取得
                const selectedServices = [];
                document.querySelectorAll('#services-checkboxes input[type="checkbox"]:checked').forEach(checkbox => {
                    selectedServices.push(checkbox.value);
                });

                console.log('📝 入力データ:', { code, description, discountType, discountValue, maxUses, expiryDate, selectedServices });

                // バリデーション
                if (!code) {
                    this.showMessage('❌ クーポンコードを入力してください', 'error');
                    return;
                }

                if (!discountType || !discountValue) {
                    this.showMessage('❌ 割引タイプと割引値を設定してください', 'error');
                    return;
                }

                if (selectedServices.length === 0) {
                    this.showMessage('❌ 適用可能サービスを1つ以上選択してください', 'error');
                    return;
                }

                // 既存チェック
                const existingCoupon = this.couponSystem.getCoupon(code);
                if (existingCoupon) {
                    this.showMessage('❌ 同じコードのクーポンが既に存在します', 'error');
                    return;
                }

                // クーポンデータ作成
                const couponData = {
                    code,
                    description,
                    discountType,
                    discountValue,
                    maxUses,
                    expiryDate: expiryDate || null,
                    applicableServices: selectedServices
                };

                console.log('💾 作成するクーポンデータ:', couponData);

                try {
                    const result = this.couponSystem.createCoupon(couponData);
                    console.log('📊 作成結果:', result);
                    
                    if (result && result.success) {
                        this.showMessage(`✅ クーポン「${code}」を作成しました`, 'success');
                        this.resetForm();
                        this.loadCoupons();
                        this.loadStats();
                    } else {
                        const errorMsg = result && result.error ? result.error : 'クーポンの作成に失敗しました';
                        this.showMessage(`❌ ${errorMsg}`, 'error');
                    }
                } catch (error) {
                    console.error('❌ クーポン作成エラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            // クイックアクション
            createQuickCoupon: function(type) {
                const now = new Date();
                const expiry = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000));

                let couponData = {};

                switch (type) {
                    case 'LINE特典':
                        couponData = {
                            code: `LINE${Math.random().toString(36).substr(2, 6).toUpperCase()}`,
                            description: 'LINE登録特典',
                            discountType: 'fixed',
                            discountValue: 500,
                            maxUses: 1,
                            expiryDate: expiry.toISOString().split('T')[0],
                            applicableServices: ['all']
                        };
                        break;
                    case 'モニター':
                        couponData = {
                            code: `MONITOR${Math.random().toString(36).substr(2, 4).toUpperCase()}`,
                            description: 'モニター用無料クーポン',
                            discountType: 'percentage',
                            discountValue: 100,
                            maxUses: 1,
                            expiryDate: new Date(now.getTime() + (7 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0],
                            applicableServices: ['all']
                        };
                        break;
                    case '新規お客様':
                        couponData = {
                            code: `NEW${Math.random().toString(36).substr(2, 6).toUpperCase()}`,
                            description: '新規お客様特典',
                            discountType: 'fixed',
                            discountValue: 1000,
                            maxUses: 1,
                            expiryDate: expiry.toISOString().split('T')[0],
                            applicableServices: ['all']
                        };
                        break;
                }

                try {
                    const result = this.couponSystem.createCoupon(couponData);
                    if (result && result.success) {
                        this.showMessage(`✅ ${type}クーポン「${couponData.code}」を作成しました`, 'success');
                        this.loadCoupons();
                        this.loadStats();
                    } else {
                        this.showMessage(`❌ ${type}クーポンの作成に失敗しました`, 'error');
                    }
                } catch (error) {
                    console.error(`❌ ${type}クーポンエラー:`, error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            generateRandomCoupon: function() {
                const code = `RANDOM${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
                const discountTypes = ['fixed', 'percentage'];
                const discountType = discountTypes[Math.floor(Math.random() * discountTypes.length)];
                const discountValue = discountType === 'percentage' ? Math.floor(Math.random() * 30) + 10 : Math.floor(Math.random() * 1000) + 500;
                
                const expiry = new Date();
                expiry.setDate(expiry.getDate() + Math.floor(Math.random() * 90) + 7);

                const couponData = {
                    code,
                    description: 'ランダム生成クーポン',
                    discountType,
                    discountValue,
                    maxUses: Math.floor(Math.random() * 5) + 1,
                    expiryDate: expiry.toISOString().split('T')[0],
                    applicableServices: ['all']
                };

                try {
                    const result = this.couponSystem.createCoupon(couponData);
                    if (result && result.success) {
                        this.showMessage(`✅ ランダムクーポン「${code}」を作成しました`, 'success');
                        this.loadCoupons();
                        this.loadStats();
                    } else {
                        this.showMessage('❌ ランダムクーポンの作成に失敗しました', 'error');
                    }
                } catch (error) {
                    console.error('❌ ランダムクーポンエラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            // ヘルパー関数
            getCouponStatus: function(coupon) {
                if (coupon.isActive === false) {
                    return { type: 'inactive', text: '無効' };
                }
                
                const now = new Date();
                const expiryDate = coupon.expiryDate ? new Date(coupon.expiryDate) : null;
                
                if (expiryDate && expiryDate < now) {
                    return { type: 'expired', text: '期限切れ' };
                }
                
                if (coupon.currentUses >= coupon.maxUses) {
                    return { type: 'used-up', text: '使用済み' };
                }
                
                return { type: 'active', text: '有効' };
            },

            formatDiscount: function(coupon) {
                if (coupon.discountType === 'percentage') {
                    return `${coupon.discountValue}% OFF`;
                } else {
                    return `${coupon.discountValue}円 OFF`;
                }
            },

            formatServices: function(services) {
                if (services.includes('all')) {
                    return '全サービス';
                }
                
                const serviceNames = services.map(service => this.couponSystem.serviceTypes[service] || service);
                return serviceNames.join(', ');
            },

            // クーポン一覧
            loadCoupons: function() {
                console.log('📋 クーポン一覧を読み込み中...');
                
                try {
                    const coupons = this.couponSystem.getAllCoupons();
                    console.log('📊 取得したクーポン数:', coupons.length);
                    
                    const container = document.getElementById('coupons-list');
                    
                    if (coupons.length === 0) {
                        container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">クーポンが登録されていません</p>';
                        return;
                    }

                    container.innerHTML = '';
                    
                    coupons.forEach(coupon => {
                        const status = this.getCouponStatus(coupon);
                        const statusClass = `status-${status.type}`;
                        
                        const couponItem = document.createElement('div');
                        couponItem.className = 'coupon-item';
                        
                        couponItem.innerHTML = `
                            <div class="coupon-header">
                                <div class="coupon-code">${coupon.code}</div>
                                <div class="coupon-status ${statusClass}">${status.text}</div>
                            </div>
                            <div class="coupon-details">
                                <div><strong>説明:</strong> ${coupon.description || 'なし'}</div>
                                <div><strong>割引:</strong> ${this.formatDiscount(coupon)}</div>
                                <div><strong>使用回数:</strong> ${coupon.currentUses}/${coupon.maxUses}</div>
                                <div><strong>有効期限:</strong> ${coupon.expiryDate || '無期限'}</div>
                                <div><strong>サービス:</strong> ${this.formatServices(coupon.applicableServices)}</div>
                                <div><strong>作成日:</strong> ${new Date(coupon.createdAt).toLocaleDateString()}</div>
                            </div>
                            <div class="coupon-actions">
                                <button class="btn btn-secondary" onclick="AdminSystem.editCoupon('${coupon.code}')">✏️ 編集</button>
                                <button class="btn ${coupon.isActive ? 'btn-danger' : 'btn-primary'}" onclick="AdminSystem.toggleCouponStatus('${coupon.code}', ${coupon.isActive})">
                                    ${coupon.isActive ? '🔴 無効化' : '🟢 有効化'}
                                </button>
                                <button class="btn btn-danger" onclick="AdminSystem.deleteCoupon('${coupon.code}')">🗑️ 削除</button>
                                <button class="btn btn-secondary" onclick="AdminSystem.viewUsageHistory('${coupon.code}')">📊 使用履歴</button>
                            </div>
                        `;
                        
                        container.appendChild(couponItem);
                    });

                    console.log(`✅ ${coupons.length}件のクーポンを読み込みました`);
                } catch (error) {
                    console.error('❌ クーポン一覧読み込みエラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            // クーポン編集
            editCoupon: function(code) {
                console.log('✏️ 編集開始:', code);
                
                const coupon = this.couponSystem.getCoupon(code);
                if (!coupon) {
                    this.showMessage('❌ クーポンが見つかりません', 'error');
                    return;
                }

                this.currentEditingCode = code;
                
                const editContent = document.getElementById('edit-form-content');
                editContent.innerHTML = `
                    <div class="form-group">
                        <label>クーポンコード</label>
                        <input type="text" id="edit-code" value="${coupon.code}" readonly style="background: rgba(255,255,255,0.1);">
                    </div>
                    <div class="form-group">
                        <label>説明</label>
                        <input type="text" id="edit-description" value="${coupon.description || ''}">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>割引タイプ</label>
                            <select id="edit-discount-type">
                                <option value="percentage" ${coupon.discountType === 'percentage' ? 'selected' : ''}>パーセント割引</option>
                                <option value="fixed" ${coupon.discountType === 'fixed' ? 'selected' : ''}>固定金額割引</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>割引値</label>
                            <input type="number" id="edit-discount-value" value="${coupon.discountValue}">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>最大使用回数</label>
                            <input type="number" id="edit-max-uses" value="${coupon.maxUses}" min="1">
                        </div>
                        <div class="form-group">
                            <label>有効期限</label>
                            <input type="date" id="edit-expiry-date" value="${coupon.expiryDate || ''}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>適用可能サービス</label>
                        <div class="checkbox-group">
                            ${Object.entries(this.couponSystem.serviceTypes).map(([key, name]) => {
                                const isChecked = coupon.applicableServices.includes(key);
                                return `
                                    <div class="checkbox-item">
                                        <input type="checkbox" id="edit-service-${key}" value="${key}" ${isChecked ? 'checked' : ''}>
                                        <label for="edit-service-${key}">${name}</label>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                    <div class="checkbox-item" style="margin: 20px 0;">
                        <input type="checkbox" id="edit-is-active" ${coupon.isActive !== false ? 'checked' : ''}>
                        <label for="edit-is-active" style="color: #4caf50; font-weight: bold;">クーポンを有効にする</label>
                    </div>
                    <div style="display: flex; gap: 15px; margin-top: 30px;">
                        <button class="btn btn-primary" onclick="AdminSystem.saveEditedCoupon()">💾 変更を保存</button>
                        <button class="btn btn-secondary" onclick="AdminSystem.closeEditModal()">❌ キャンセル</button>
                    </div>
                `;
                
                document.getElementById('edit-modal').style.display = 'flex';
            },

            saveEditedCoupon: function() {
                if (!this.currentEditingCode) return;

                const description = document.getElementById('edit-description').value.trim();
                const discountType = document.getElementById('edit-discount-type').value;
                const discountValue = parseFloat(document.getElementById('edit-discount-value').value);
                const maxUses = parseInt(document.getElementById('edit-max-uses').value);
                const expiryDate = document.getElementById('edit-expiry-date').value;
                const isActive = document.getElementById('edit-is-active').checked;

                const selectedServices = [];
                document.querySelectorAll('#edit-form-content input[type="checkbox"]:checked').forEach(checkbox => {
                    if (checkbox.id !== 'edit-is-active') {
                        selectedServices.push(checkbox.value);
                    }
                });

                if (!discountType || !discountValue) {
                    this.showMessage('❌ 割引タイプと割引値を設定してください', 'error');
                    return;
                }

                if (selectedServices.length === 0) {
                    this.showMessage('❌ 適用可能サービスを1つ以上選択してください', 'error');
                    return;
                }

                const updates = {
                    description,
                    discountType,
                    discountValue,
                    maxUses,
                    expiryDate: expiryDate || null,
                    applicableServices: selectedServices,
                    isActive
                };

                try {
                    const result = this.couponSystem.updateCoupon(this.currentEditingCode, updates);
                    
                    if (result && result.success) {
                        this.showMessage(`✅ クーポン「${this.currentEditingCode}」を更新しました`, 'success');
                        this.closeEditModal();
                        this.loadCoupons();
                        this.loadStats();
                    } else {
                        this.showMessage('❌ クーポンの更新に失敗しました', 'error');
                    }
                } catch (error) {
                    console.error('❌ 更新エラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            closeEditModal: function() {
                document.getElementById('edit-modal').style.display = 'none';
                this.currentEditingCode = null;
            },

            // 使用履歴
            viewUsageHistory: function(code) {
                console.log('📊 使用履歴表示:', code);
                
                try {
                    const usage = this.couponSystem.getAllUsage().filter(u => u.couponCode === code);
                    const coupon = this.couponSystem.getCoupon(code);
                    
                    let historyHTML = `
                        <div style="margin-bottom: 20px;">
                            <h3 style="color: #ffd700;">クーポン「${code}」</h3>
                            <p style="color: rgba(255,255,255,0.8);">${coupon?.description || '説明なし'}</p>
                        </div>
                    `;
                    
                    if (usage.length === 0) {
                        historyHTML += '<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">使用履歴はありません</p>';
                    } else {
                        historyHTML += `
                            <div style="margin-bottom: 20px;">
                                <div class="stats-grid">
                                    <div class="stat-card">
                                        <div class="stat-number">${usage.length}</div>
                                        <div>総使用回数</div>
                                    </div>
                                    <div class="stat-card">
                                        <div class="stat-number">¥${usage.reduce((sum, u) => sum + (u.discountAmount || 0), 0).toLocaleString()}</div>
                                        <div>総割引額</div>
                                    </div>
                                    <div class="stat-card">
                                        <div class="stat-number">${[...new Set(usage.map(u => u.userEmail))].length}</div>
                                        <div>利用者数</div>
                                    </div>
                                </div>
                            </div>
                            
                            <table class="history-table">
                                <thead>
                                    <tr>
                                        <th>使用日時</th>
                                        <th>サービス</th>
                                        <th>利用者</th>
                                        <th>割引額</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${usage.reverse().map(u => {
                                        const serviceTypeName = this.couponSystem.serviceTypes[u.serviceType] || u.serviceType;
                                        return `
                                            <tr>
                                                <td>${new Date(u.usedAt).toLocaleString()}</td>
                                                <td>${serviceTypeName}</td>
                                                <td style="font-family: monospace;">${u.userEmail}</td>
                                                <td style="color: #4caf50; font-weight: bold;">¥${(u.discountAmount || 0).toLocaleString()}</td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        `;
                    }
                    
                    document.getElementById('history-content').innerHTML = historyHTML;
                    document.getElementById('history-modal').style.display = 'flex';
                } catch (error) {
                    console.error('❌ 履歴表示エラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            closeHistoryModal: function() {
                document.getElementById('history-modal').style.display = 'none';
            },

            // その他の操作
            toggleCouponStatus: function(code, currentStatus) {
                try {
                    const newStatus = !currentStatus;
                    const result = this.couponSystem.updateCoupon(code, { isActive: newStatus });
                    
                    if (result && result.success) {
                        const statusText = newStatus ? '有効' : '無効';
                        this.showMessage(`✅ クーポン「${code}」を${statusText}にしました`, 'success');
                        this.loadCoupons();
                        this.loadStats();
                    } else {
                        this.showMessage('❌ ステータスの変更に失敗しました', 'error');
                    }
                } catch (error) {
                    console.error('❌ ステータス変更エラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            deleteCoupon: function(code) {
                if (confirm(`クーポン「${code}」を削除しますか？\nこの操作は取り消せません。`)) {
                    try {
                        const result = this.couponSystem.deleteCoupon(code);
                        
                        if (result && result.success) {
                            this.showMessage(`✅ クーポン「${code}」を削除しました`, 'success');
                            this.loadCoupons();
                            this.loadStats();
                        } else {
                            this.showMessage('❌ クーポンの削除に失敗しました', 'error');
                        }
                    } catch (error) {
                        console.error('❌ 削除エラー:', error);
                        this.showMessage(`❌ エラー: ${error.message}`, 'error');
                    }
                }
            },

            bulkDeleteExpired: function() {
                try {
                    const coupons = this.couponSystem.getAllCoupons();
                    const expiredCoupons = coupons.filter(c => this.getCouponStatus(c).type === 'expired');
                    
                    if (expiredCoupons.length === 0) {
                        this.showMessage('❌ 期限切れのクーポンはありません', 'error');
                        return;
                    }

                    if (confirm(`${expiredCoupons.length}件の期限切れクーポンを削除しますか？`)) {
                        let deletedCount = 0;
                        
                        expiredCoupons.forEach(coupon => {
                            const result = this.couponSystem.deleteCoupon(coupon.code);
                            if (result && result.success) {
                                deletedCount++;
                            }
                        });

                        this.showMessage(`✅ ${deletedCount}件の期限切れクーポンを削除しました`, 'success');
                        this.loadCoupons();
                        this.loadStats();
                    }
                } catch (error) {
                    console.error('❌ 一括削除エラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            exportData: function() {
                try {
                    const coupons = this.couponSystem.getAllCoupons();
                    const usage = this.couponSystem.getAllUsage();
                    
                    const data = {
                        exportDate: new Date().toISOString(),
                        coupons: coupons,
                        usage: usage
                    };

                    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `coupon-data-${new Date().toISOString().split('T')[0]}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);

                    this.showMessage('✅ データをエクスポートしました', 'success');
                } catch (error) {
                    console.error('❌ エクスポートエラー:', error);
                    this.showMessage(`❌ エラー: ${error.message}`, 'error');
                }
            },

            loadStats: function() {
                try {
                    const coupons = this.couponSystem.getAllCoupons();
                    const usage = this.couponSystem.getAllUsage();
                    
                    const totalCoupons = coupons.length;
                    const activeCoupons = coupons.filter(c => this.getCouponStatus(c).type === 'active').length;
                    const totalUsage = usage.length;
                    const totalDiscount = usage.reduce((sum, u) => sum + (u.discountAmount || 0), 0);

                    document.getElementById('stats-container').innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${totalCoupons}</div>
                            <div>総クーポン数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${activeCoupons}</div>
                            <div>有効クーポン</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${totalUsage}</div>
                            <div>総利用回数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">¥${totalDiscount.toLocaleString()}</div>
                            <div>総割引額</div>
                        </div>
                    `;
                } catch (error) {
                    console.error('❌ 統計読み込みエラー:', error);
                }
            }
        };

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            AdminSystem.init();
        });

        console.log('🚀 完全動作版管理画面スクリプト読み込み完了');
    </script>
</body>
</html>
