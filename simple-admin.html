<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面アクセス - Salon de Serafina</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a0033, #4a0080, #6a0dad);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .simple-admin {
            text-align: center;
            padding: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
            width: 90%;
        }
        
        .simple-admin h1 {
            color: #ffd700;
            margin-bottom: 30px;
            font-size: 2.5em;
        }
        
        .access-methods {
            display: grid;
            gap: 20px;
            margin: 30px 0;
        }
        
        .access-link {
            display: block;
            padding: 20px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2em;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }
        
        .access-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }
        
        .password-info {
            background: rgba(255, 193, 7, 0.2);
            border: 1px solid #ffc107;
            padding: 20px;
            border-radius: 15px;
            margin: 30px 0;
        }
        
        .quick-access {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
        
        .back-link {
            margin-top: 30px;
        }
        
        .back-link a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 1em;
        }
        
        .back-link a:hover {
            color: #ffd700;
        }
        
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.3);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.3);
            border: 1px solid #f44336;
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="simple-admin">
        <h1>🛠️ 管理画面アクセス</h1>
        <p>簡単・確実・安全なアクセス方法</p>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="password-info">
            <h3>🔑 管理者パスワード</h3>
            <p><strong>serafina2024</strong></p>
            <p style="font-size: 0.9em; margin-top: 10px;">
                管理画面にアクセスする際に使用します
            </p>
        </div>
        
        <div class="access-methods">
            <a href="direct-admin.html" class="access-link">
                🎫 クーポン管理システム（直接アクセス）
                <br><small style="font-size: 0.8em;">（推奨・確実な方法）</small>
            </a>
            
            <a href="#" onclick="openDirect()" class="access-link">
                📱 直接アクセステスト
                <br><small style="font-size: 0.8em;">（パス確認付き）</small>
            </a>
            
            <a href="demo/coupon-demo.html" class="access-link">
                🧪 クーポンテストページ
                <br><small style="font-size: 0.8em;">（動作確認用）</small>
            </a>
        </div>
        
        <div class="quick-access">
            <h3>⚡ クイックアクセス</h3>
            <p>このページをブックマークすると便利です</p>
            <p style="font-size: 0.9em; color: rgba(255,255,255,0.7);">
                📍 URL: simple-admin.html
            </p>
        </div>
        
        <div class="back-link">
            <a href="omikuji/index.html">← サイトトップに戻る</a>
        </div>
    </div>
    
    <script>
        function showStatus(message, isSuccess = true) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${isSuccess ? 'success' : 'error'}`;
            status.style.display = 'block';
            
            setTimeout(() => {
                status.style.display = 'none';
            }, 3000);
        }
        
        function testAndOpenAdmin() {
            showStatus('🔍 管理画面へのアクセスを試行中...', true);
            
            // 複数のパスを順番に試す
            const paths = [
                'admin/coupon-admin.html',
                './admin/coupon-admin.html',
                '../admin/coupon-admin.html'
            ];
            
            let pathIndex = 0;
            
            function tryNextPath() {
                if (pathIndex < paths.length) {
                    const currentPath = paths[pathIndex];
                    console.log(`🔍 パスを試行中: ${currentPath}`);
                    
                    // 新しいウィンドウで開く
                    const newWindow = window.open(currentPath, '_blank');
                    
                    if (newWindow) {
                        showStatus(`✅ 管理画面を開きました: ${currentPath}`, true);
                        console.log(`✅ 成功: ${currentPath}`);
                    } else {
                        console.log(`❌ 失敗: ${currentPath}`);
                        pathIndex++;
                        setTimeout(tryNextPath, 500);
                    }
                } else {
                    showStatus('❌ 管理画面にアクセスできませんでした', false);
                    console.log('❌ すべてのパスが失敗しました');
                    
                    // フォールバック: 手動で確認
                    setTimeout(() => {
                        if (confirm('手動でパスを確認しますか？')) {
                            openDirect();
                        }
                    }, 1000);
                }
            }
            
            tryNextPath();
        }
        
        function openDirect() {
            showStatus('📱 直接アクセスを試行中...', true);
            
            // admin/coupon-admin.html を直接開く
            try {
                const adminWindow = window.open('admin/coupon-admin.html', '_blank', 'width=1200,height=800');
                
                if (adminWindow) {
                    showStatus('✅ 管理画面が開きました！', true);
                    console.log('✅ 直接アクセス成功');
                } else {
                    throw new Error('ウィンドウが開けませんでした');
                }
            } catch (error) {
                showStatus('❌ 直接アクセスに失敗しました', false);
                console.error('❌ 直接アクセスエラー:', error);
                
                // さらにフォールバック
                setTimeout(() => {
                    alert('ブラウザの設定でポップアップがブロックされている可能性があります。\n\n手動で以下のファイルを開いてください:\nadmin/coupon-admin.html');
                }, 1000);
            }
        }
        
        // ページ読み込み時のログ
        console.log('🚀 簡単管理画面アクセスページが読み込まれました');
        console.log('📍 現在のURL:', window.location.href);
        console.log('📂 ベースパス:', window.location.pathname);
    </script>
</body>
</html>
