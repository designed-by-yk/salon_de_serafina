<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クーポン管理 - Salon de Serafina</title>
    
    <!-- クーポンシステム -->
    <script src="js/coupon-system.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .admin-header h1 {
            color: #ffd700;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            color: #ffd700;
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            font-size: 16px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn-danger {
            background: linear-gradient(45deg, #ff4757, #ff6b6b);
            color: #fff;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .coupon-list {
            margin-top: 20px;
        }

        .coupon-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .coupon-item:hover {
            border-color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
        }

        .coupon-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .coupon-code {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
        }

        .coupon-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.3);
            color: #4caf50;
        }

        .status-expired {
            background: rgba(244, 67, 54, 0.3);
            color: #f44336;
        }

        .status-used-up {
            background: rgba(156, 39, 176, 0.3);
            color: #9c27b0;
        }

        .status-inactive {
            background: rgba(158, 158, 158, 0.3);
            color: #9e9e9e;
        }

        .coupon-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .coupon-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }

        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #ffd700;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .coupon-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .coupon-actions {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <!-- 管理画面本体 -->
    <div id="admin-main" class="admin-container">
        <div class="admin-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🎫 クーポン管理システム</h1>
                    <p>Salon de Serafina - 管理者画面</p>
                </div>
                <div>
                    <a href="omikuji/index.html" class="btn btn-secondary">🏠 トップページ</a>
                </div>
            </div>
        </div>

        <!-- 統計情報 -->
        <div class="admin-section">
            <h2 class="section-title">📊 統計情報</h2>
            <div id="stats-container" class="stats-grid">
                <!-- 統計データがここに表示されます -->
            </div>
        </div>

        <!-- クイックアクション -->
        <div class="admin-section">
            <h2 class="section-title">⚡ クイックアクション</h2>
            <div class="quick-actions">
                <button onclick="createQuickCoupon('LINE特典')" class="btn btn-primary">
                    📱 LINE特典クーポン
                </button>
                <button onclick="createQuickCoupon('モニター')" class="btn btn-primary">
                    🎯 モニター用クーポン
                </button>
                <button onclick="createQuickCoupon('新規お客様')" class="btn btn-primary">
                    ✨ 新規お客様特典
                </button>
                <button onclick="generateRandomCoupon()" class="btn btn-secondary">
                    🎲 ランダムクーポン生成
                </button>
            </div>
        </div>

        <!-- クーポン作成フォーム -->
        <div class="admin-section">
            <h2 class="section-title">➕ 新規クーポン作成</h2>
            
            <form id="coupon-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="coupon-code">クーポンコード *</label>
                        <input type="text" id="coupon-code" required placeholder="例: WELCOME2024">
                    </div>
                    <div class="form-group">
                        <label for="coupon-description">説明</label>
                        <input type="text" id="coupon-description" placeholder="例: 新規お客様特典">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="discount-type">割引タイプ *</label>
                        <select id="discount-type" required onchange="updateDiscountInput()">
                            <option value="">選択してください</option>
                            <option value="percentage">パーセント割引</option>
                            <option value="fixed">固定金額割引</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="discount-value">割引値 *</label>
                        <input type="number" id="discount-value" required placeholder="例: 500">
                        <small id="discount-unit" style="color: rgba(255,255,255,0.7);"></small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="max-uses">最大使用回数</label>
                        <input type="number" id="max-uses" value="1" min="1" placeholder="例: 5">
                    </div>
                    <div class="form-group">
                        <label for="expiry-type">有効期限タイプ</label>
                        <select id="expiry-type" onchange="updateExpiryInput()">
                            <option value="date">指定日まで</option>
                            <option value="one_year">発行から1年間有効</option>
                            <option value="unlimited">無期限</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="expiry-date-group">
                    <label for="expiry-date">有効期限</label>
                    <input type="date" id="expiry-date">
                </div>

                <div class="form-group">
                    <label>適用可能サービス *</label>
                    <div id="services-checkboxes" class="checkbox-group">
                        <!-- サービスチェックボックスがここに生成されます -->
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary">
                        ➕ クーポンを作成
                    </button>
                    <button type="button" onclick="resetForm()" class="btn btn-secondary">
                        🔄 フォームリセット
                    </button>
                </div>
            </form>
        </div>

        <!-- クーポン一覧 -->
        <div class="admin-section">
            <h2 class="section-title">📋 クーポン一覧</h2>
            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <button onclick="loadCoupons()" class="btn btn-secondary">
                    🔄 更新
                </button>
                <button onclick="bulkDeleteExpired()" class="btn btn-danger">
                    🗑️ 期限切れ一括削除
                </button>
                <button onclick="exportData()" class="btn btn-secondary">
                    📊 データエクスポート
                </button>
            </div>
            <div id="coupons-list" class="coupon-list">
                <!-- クーポン一覧がここに表示されます -->
            </div>
        </div>
    </div>

    <!-- 編集モーダル -->
    <div id="edit-modal" style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    ">
        <div style="
            background: linear-gradient(135deg, #1a0033, #2d1b69);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 0, 0.3);
        ">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #ffd700; margin: 0;">✏️ クーポン編集</h2>
                <button onclick="closeEditModal()" style="
                    background: none;
                    border: none;
                    color: #fff;
                    font-size: 24px;
                    cursor: pointer;
                    padding: 5px;
                ">×</button>
            </div>

            <form id="edit-form">
                <div class="form-group">
                    <label for="edit-code">クーポンコード</label>
                    <input type="text" id="edit-code" readonly style="background: rgba(255,255,255,0.1);">
                </div>

                <div class="form-group">
                    <label for="edit-description">説明</label>
                    <input type="text" id="edit-description">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-discount-type">割引タイプ</label>
                        <select id="edit-discount-type" onchange="updateEditDiscountInput()">
                            <option value="percentage">パーセント割引</option>
                            <option value="fixed">固定金額割引</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="edit-discount-value">割引値</label>
                        <input type="number" id="edit-discount-value">
                        <small id="edit-discount-unit" style="color: rgba(255,255,255,0.7);"></small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edit-max-uses">最大使用回数</label>
                        <input type="number" id="edit-max-uses" min="1">
                    </div>
                    <div class="form-group">
                        <label for="edit-expiry-type">有効期限タイプ</label>
                        <select id="edit-expiry-type" onchange="updateEditExpiryInput()">
                            <option value="date">指定日まで</option>
                            <option value="one_year">発行から1年間有効</option>
                            <option value="unlimited">無期限</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="edit-expiry-date-group">
                    <label for="edit-expiry-date">有効期限</label>
                    <input type="date" id="edit-expiry-date">
                </div>

                <div class="form-group">
                    <label>適用可能サービス</label>
                    <div id="edit-services-checkboxes" class="checkbox-group">
                        <!-- サービスチェックボックスがここに生成されます -->
                    </div>
                </div>

                <div class="form-group">
                    <div class="checkbox-item" style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px;">
                        <input type="checkbox" id="edit-is-active" style="width: 20px; height: 20px;">
                        <label for="edit-is-active" style="font-weight: bold; color: #4caf50;">クーポンを有効にする</label>
                    </div>
                </div>

                <div style="display: flex; gap: 15px; margin-top: 30px;">
                    <button type="button" onclick="saveEditedCoupon()" class="btn btn-primary">
                        💾 変更を保存
                    </button>
                    <button type="button" onclick="closeEditModal()" class="btn btn-secondary">
                        ❌ キャンセル
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 使用履歴モーダル -->
    <div id="history-modal" style="
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        justify-content: center;
        align-items: center;
    ">
        <div style="
            background: linear-gradient(135deg, #1a0033, #2d1b69);
            border-radius: 15px;
            padding: 30px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 215, 0, 0.3);
        ">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #ffd700; margin: 0;">📊 使用履歴</h2>
                <button onclick="closeHistoryModal()" style="
                    background: none;
                    border: none;
                    color: #fff;
                    font-size: 24px;
                    cursor: pointer;
                    padding: 5px;
                ">×</button>
            </div>
            <div id="history-content">
                <!-- 使用履歴がここに表示されます -->
            </div>
        </div>
    </div>

    <script>
        // グローバル変数
        let couponSystem = null;
        let currentEditingCode = null;

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📱 直接管理画面を初期化中...');
            
            // ウィンドウオブジェクトを確認
            console.log('🔍 window.couponSystem:', window.couponSystem);
            console.log('🔍 window.CouponSystem:', window.CouponSystem);
            
            // クーポンシステム初期化
            if (window.couponSystem) {
                couponSystem = window.couponSystem;
                console.log('✅ 既存のcouponSystemを使用');
            } else if (window.CouponSystem) {
                console.log('🔧 新しいCouponSystemインスタンスを作成');
                couponSystem = new window.CouponSystem();
                window.couponSystem = couponSystem;
            } else {
                console.error('❌ CouponSystemクラスが見つかりません');
                alert('クーポンシステムの初期化に失敗しました。js/coupon-system.js が正しく読み込まれているか確認してください。');
                return;
            }

            console.log('📊 使用するcouponSystem:', couponSystem);
            console.log('📊 初期クーポン数:', couponSystem.getAllCoupons().length);
            
            console.log('✅ クーポンシステム初期化完了');
            
            // UI初期化
            initializeUI();
            
            // 初期データ読み込み
            loadCoupons();
            loadStats();
            
            // イベントバインド
            bindEvents();
            
            // 初期表示設定
            updateExpiryInput();
        });

        // UI初期化
        function initializeUI() {
            console.log('🎨 UI初期化中...');
            
            // サービスチェックボックスを生成
            const servicesContainer = document.getElementById('services-checkboxes');
            const services = couponSystem.serviceTypes;
            
            Object.entries(services).forEach(([key, name]) => {
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'checkbox-item';
                checkboxItem.innerHTML = `
                    <input type="checkbox" id="service-${key}" value="${key}">
                    <label for="service-${key}">${name}</label>
                `;
                servicesContainer.appendChild(checkboxItem);
            });

            console.log('✅ UI初期化完了');
        }

        // イベントバインド
        function bindEvents() {
            // フォーム送信
            document.getElementById('coupon-form').addEventListener('submit', function(e) {
                e.preventDefault();
                createCoupon();
            });
        }

        // 割引タイプ変更時の処理
        function updateDiscountInput() {
            const discountType = document.getElementById('discount-type').value;
            const unitSpan = document.getElementById('discount-unit');
            
            if (discountType === 'percentage') {
                unitSpan.textContent = '% (例: 20 = 20%OFF)';
            } else if (discountType === 'fixed') {
                unitSpan.textContent = '円 (例: 500 = 500円OFF)';
            } else {
                unitSpan.textContent = '';
            }
        }

        // クーポン作成
        function createCoupon() {
            console.log('🔧 クーポン作成開始...');
            
            const code = document.getElementById('coupon-code').value.trim().toUpperCase();
            const description = document.getElementById('coupon-description').value.trim();
            const discountType = document.getElementById('discount-type').value;
            const discountValue = parseFloat(document.getElementById('discount-value').value);
            const maxUses = parseInt(document.getElementById('max-uses').value) || 1;
            const expiryType = document.getElementById('expiry-type').value;
            
            // 有効期限の設定
            let expiryDate = null;
            let expiryTypeValue = null;
            
            if (expiryType === 'date') {
                expiryDate = document.getElementById('expiry-date').value;
            } else if (expiryType === 'one_year') {
                const oneYearLater = new Date();
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                expiryDate = oneYearLater.toISOString().split('T')[0];
                expiryTypeValue = 'one_year';
            }

            // 適用可能サービスを取得
            const selectedServices = [];
            document.querySelectorAll('#services-checkboxes input[type="checkbox"]:checked').forEach(checkbox => {
                selectedServices.push(checkbox.value);
            });

            console.log('📝 入力データ:', {
                code,
                description,
                discountType,
                discountValue,
                maxUses,
                expiryDate,
                selectedServices
            });

            // バリデーション
            if (!code) {
                showMessage('❌ クーポンコードを入力してください', 'error');
                return;
            }

            if (!discountType || !discountValue) {
                showMessage('❌ 割引タイプと割引値を設定してください', 'error');
                return;
            }

            if (selectedServices.length === 0) {
                showMessage('❌ 適用可能サービスを1つ以上選択してください', 'error');
                return;
            }

            // 既存チェック
            const existingCoupon = couponSystem.getCoupon(code);
            if (existingCoupon) {
                console.log('⚠️ 既存クーポン発見:', existingCoupon);
                showMessage('❌ 同じコードのクーポンが既に存在します', 'error');
                return;
            }

            // クーポンデータ作成
            const couponData = {
                code,
                description,
                discountType,
                discountValue,
                maxUses,
                expiryDate: expiryDate || null,
                expiryType: expiryTypeValue,
                applicableServices: selectedServices
            };

            console.log('💾 作成するクーポンデータ:', couponData);

            // クーポン作成
            const result = couponSystem.createCoupon(couponData);

            console.log('📊 作成結果:', result);
            
            if (result && result.success) {
                // 作成後の確認
                const createdCoupon = couponSystem.getCoupon(code);
                console.log('✅ 作成されたクーポン:', createdCoupon);
                
                const allCoupons = couponSystem.getAllCoupons();
                console.log('📋 現在の全クーポン数:', allCoupons.length);
                console.log('📋 全クーポン一覧:', allCoupons);
                
                showMessage(`✅ クーポン「${code}」を作成しました`, 'success');
                resetForm();
                loadCoupons();
                loadStats();
            } else {
                console.error('❌ クーポン作成失敗:', result);
                const errorMsg = result && result.error ? result.error : 'クーポンの作成に失敗しました';
                showMessage(`❌ ${errorMsg}`, 'error');
            }
        }

        // フォームリセット
        function resetForm() {
            document.getElementById('coupon-form').reset();
            document.getElementById('discount-unit').textContent = '';
            
            // 有効期限タイプをリセット
            document.getElementById('expiry-type').value = 'date';
            updateExpiryInput();
            
            // サービスチェックボックスをリセット
            document.querySelectorAll('#services-checkboxes input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            
            console.log('📝 フォームをリセットしました');
        }

        // クイククーポン作成
        function createQuickCoupon(type) {
            const now = new Date();
            const expiry = new Date(now.getTime() + (30 * 24 * 60 * 60 * 1000)); // 30日後

            let couponData = {};

            switch (type) {
                case 'LINE特典':
                    couponData = {
                        code: `LINE${Math.random().toString(36).substr(2, 6).toUpperCase()}`,
                        description: 'LINE登録特典',
                        discountType: 'fixed',
                        discountValue: 500,
                        maxUses: 1,
                        expiryDate: expiry.toISOString().split('T')[0],
                        applicableServices: ['all']
                    };
                    break;
                case 'モニター':
                    couponData = {
                        code: `MONITOR${Math.random().toString(36).substr(2, 4).toUpperCase()}`,
                        description: 'モニター用無料クーポン',
                        discountType: 'percentage',
                        discountValue: 100,
                        maxUses: 1,
                        expiryDate: new Date(now.getTime() + (7 * 24 * 60 * 60 * 1000)).toISOString().split('T')[0], // 7日後
                        applicableServices: ['all']
                    };
                    break;
                case '新規お客様':
                    couponData = {
                        code: `NEW${Math.random().toString(36).substr(2, 6).toUpperCase()}`,
                        description: '新規お客様特典',
                        discountType: 'fixed',
                        discountValue: 1000,
                        maxUses: 1,
                        expiryDate: expiry.toISOString().split('T')[0],
                        applicableServices: ['all']
                    };
                    break;
            }

            console.log(`🚀 ${type}クーポン作成開始:`, couponData);
            const result = couponSystem.createCoupon(couponData);
            console.log(`📊 ${type}クーポン作成結果:`, result);
            
            if (result && result.success) {
                showMessage(`✅ ${type}クーポン「${couponData.code}」を作成しました`, 'success');
                loadCoupons();
                loadStats();
            } else {
                console.error(`❌ ${type}クーポンの作成に失敗:`, result);
                showMessage(`❌ ${type}クーポンの作成に失敗しました`, 'error');
            }
        }

        // ランダムクーポン生成
        function generateRandomCoupon() {
            const code = `RANDOM${Math.random().toString(36).substr(2, 6).toUpperCase()}`;
            const discountTypes = ['fixed', 'percentage'];
            const discountType = discountTypes[Math.floor(Math.random() * discountTypes.length)];
            const discountValue = discountType === 'percentage' ? Math.floor(Math.random() * 30) + 10 : Math.floor(Math.random() * 1000) + 500;
            
            const expiry = new Date();
            expiry.setDate(expiry.getDate() + Math.floor(Math.random() * 90) + 7); // 7-97日後

            const couponData = {
                code,
                description: 'ランダム生成クーポン',
                discountType,
                discountValue,
                maxUses: Math.floor(Math.random() * 5) + 1,
                expiryDate: expiry.toISOString().split('T')[0],
                applicableServices: ['all']
            };

            console.log('🎲 ランダムクーポン作成開始:', couponData);
            const result = couponSystem.createCoupon(couponData);
            console.log('🎲 ランダムクーポン作成結果:', result);
            
            if (result && result.success) {
                showMessage(`✅ ランダムクーポン「${code}」を作成しました`, 'success');
                loadCoupons();
                loadStats();
            } else {
                console.error('❌ ランダムクーポンの作成に失敗:', result);
                showMessage('❌ ランダムクーポンの作成に失敗しました', 'error');
            }
        }

        // クーポン読み込み
        function loadCoupons() {
            console.log('📋 クーポン一覧を読み込み中...');
            
            if (!couponSystem) {
                console.error('❌ couponSystemが利用できません');
                return;
            }
            
            const coupons = couponSystem.getAllCoupons();
            console.log('📊 取得したクーポン数:', coupons.length);
            console.log('📊 取得したクーポン:', coupons);
            
            const container = document.getElementById('coupons-list');
            if (!container) {
                console.error('❌ coupons-listコンテナが見つかりません');
                return;
            }
            
            if (coupons.length === 0) {
                console.log('📋 クーポンが0件です');
                container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">クーポンが登録されていません</p>';
                return;
            }

            // 一覧をクリアして再構築
            container.innerHTML = '';
            
            coupons.forEach(coupon => {
                const status = getCouponStatus(coupon);
                const statusClass = `status-${status.type}`;
                
                // クーポン項目要素を作成
                const couponItem = document.createElement('div');
                couponItem.className = 'coupon-item';
                
                // クーポンヘッダー
                const couponHeader = document.createElement('div');
                couponHeader.className = 'coupon-header';
                couponHeader.innerHTML = `
                    <div class="coupon-code">${coupon.code}</div>
                    <div class="coupon-status ${statusClass}">${status.text}</div>
                `;
                
                // クーポン詳細
                const couponDetails = document.createElement('div');
                couponDetails.className = 'coupon-details';
                couponDetails.innerHTML = `
                    <div><strong>説明:</strong> ${coupon.description || 'なし'}</div>
                    <div><strong>割引:</strong> ${formatDiscount(coupon)}</div>
                    <div><strong>使用回数:</strong> ${coupon.currentUses}/${coupon.maxUses}</div>
                    <div><strong>有効期限:</strong> ${coupon.expiryDate || '無期限'}</div>
                    <div><strong>サービス:</strong> ${formatServices(coupon.applicableServices)}</div>
                    <div><strong>作成日:</strong> ${new Date(coupon.createdAt).toLocaleDateString()}</div>
                `;
                
                // クーポンアクション
                const couponActions = document.createElement('div');
                couponActions.className = 'coupon-actions';
                
                // 編集ボタン
                const editBtn = document.createElement('button');
                editBtn.className = 'btn btn-secondary';
                editBtn.innerHTML = '✏️ 編集';
                editBtn.onclick = () => editCoupon(coupon.code);
                
                // 有効/無効切り替えボタン
                const toggleBtn = document.createElement('button');
                toggleBtn.className = `btn ${coupon.isActive ? 'btn-danger' : 'btn-primary'}`;
                toggleBtn.innerHTML = coupon.isActive ? '🔴 無効化' : '🟢 有効化';
                toggleBtn.onclick = () => toggleCouponStatus(coupon.code, coupon.isActive);
                
                // 削除ボタン
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn btn-danger';
                deleteBtn.innerHTML = '🗑️ 削除';
                deleteBtn.onclick = () => deleteCoupon(coupon.code);
                
                // 使用履歴ボタン
                const historyBtn = document.createElement('button');
                historyBtn.className = 'btn btn-secondary';
                historyBtn.innerHTML = '📊 使用履歴';
                historyBtn.onclick = () => viewUsageHistory(coupon.code);
                
                // ボタンをアクションコンテナに追加
                couponActions.appendChild(editBtn);
                couponActions.appendChild(toggleBtn);
                couponActions.appendChild(deleteBtn);
                couponActions.appendChild(historyBtn);
                
                // 要素を組み立て
                couponItem.appendChild(couponHeader);
                couponItem.appendChild(couponDetails);
                couponItem.appendChild(couponActions);
                
                // コンテナに追加
                container.appendChild(couponItem);
            });

            console.log(`✅ ${coupons.length}件のクーポンを読み込みました`);
        }

        // 統計情報読み込み
        function loadStats() {
            const coupons = couponSystem.getAllCoupons();
            const usage = couponSystem.getAllUsage();
            
            const totalCoupons = coupons.length;
            const activeCoupons = coupons.filter(c => getCouponStatus(c).type === 'active').length;
            const totalUsage = usage.length;
            const totalDiscount = usage.reduce((sum, u) => sum + (u.discountAmount || 0), 0);

            document.getElementById('stats-container').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalCoupons}</div>
                    <div>総クーポン数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${activeCoupons}</div>
                    <div>有効クーポン</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalUsage}</div>
                    <div>総利用回数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">¥${totalDiscount.toLocaleString()}</div>
                    <div>総割引額</div>
                </div>
            `;
        }

        // クーポン削除
        function deleteCoupon(code) {
            if (confirm(`クーポン「${code}」を削除しますか？\nこの操作は取り消せません。`)) {
                const success = couponSystem.deleteCoupon(code);
                
                if (success) {
                    showMessage(`✅ クーポン「${code}」を削除しました`, 'success');
                    loadCoupons();
                    loadStats();
                } else {
                    showMessage('❌ クーポンの削除に失敗しました', 'error');
                }
            }
        }

        // 期限切れクーポン一括削除
        function bulkDeleteExpired() {
            const coupons = couponSystem.getAllCoupons();
            const expiredCoupons = coupons.filter(c => getCouponStatus(c).type === 'expired');
            
            if (expiredCoupons.length === 0) {
                showMessage('❌ 期限切れのクーポンはありません', 'error');
                return;
            }

            if (confirm(`${expiredCoupons.length}件の期限切れクーポンを削除しますか？`)) {
                let deletedCount = 0;
                
                expiredCoupons.forEach(coupon => {
                    if (couponSystem.deleteCoupon(coupon.code)) {
                        deletedCount++;
                    }
                });

                showMessage(`✅ ${deletedCount}件の期限切れクーポンを削除しました`, 'success');
                loadCoupons();
                loadStats();
            }
        }

        // データエクスポート
        function exportData() {
            const coupons = couponSystem.getAllCoupons();
            const usage = couponSystem.getAllUsage();
            
            const data = {
                exportDate: new Date().toISOString(),
                coupons: coupons,
                usage: usage
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `coupon-data-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showMessage('✅ データをエクスポートしました', 'success');
        }

        // ヘルパー関数
        function getCouponStatus(coupon) {
            // 無効化されている場合
            if (coupon.isActive === false) {
                return { type: 'inactive', text: '無効' };
            }
            
            const now = new Date();
            const expiryDate = coupon.expiryDate ? new Date(coupon.expiryDate) : null;
            
            if (expiryDate && expiryDate < now) {
                return { type: 'expired', text: '期限切れ' };
            }
            
            if (coupon.currentUses >= coupon.maxUses) {
                return { type: 'used-up', text: '使用済み' };
            }
            
            return { type: 'active', text: '有効' };
        }

        function formatDiscount(coupon) {
            if (coupon.discountType === 'percentage') {
                return `${coupon.discountValue}% OFF`;
            } else {
                return `${coupon.discountValue}円 OFF`;
            }
        }

        function formatServices(services) {
            if (services.includes('all')) {
                return '全サービス';
            }
            
            const serviceNames = services.map(service => couponSystem.serviceTypes[service] || service);
            return serviceNames.join(', ');
        }

        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.admin-section');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // 有効期限タイプの切り替え（新規作成用）
        function updateExpiryInput() {
            const expiryType = document.getElementById('expiry-type').value;
            const expiryDateGroup = document.getElementById('expiry-date-group');
            
            if (expiryType === 'date') {
                expiryDateGroup.style.display = 'block';
            } else {
                expiryDateGroup.style.display = 'none';
            }
        }

        // 有効期限タイプの切り替え（編集用）
        function updateEditExpiryInput() {
            const expiryType = document.getElementById('edit-expiry-type').value;
            const expiryDateGroup = document.getElementById('edit-expiry-date-group');
            
            if (expiryType === 'date') {
                expiryDateGroup.style.display = 'block';
            } else {
                expiryDateGroup.style.display = 'none';
            }
        }

        // 編集用割引タイプ更新
        function updateEditDiscountInput() {
            const discountType = document.getElementById('edit-discount-type').value;
            const unitSpan = document.getElementById('edit-discount-unit');
            
            if (discountType === 'percentage') {
                unitSpan.textContent = '% (例: 20 = 20%OFF)';
            } else if (discountType === 'fixed') {
                unitSpan.textContent = '円 (例: 500 = 500円OFF)';
            } else {
                unitSpan.textContent = '';
            }
        }

        // クーポン編集
        function editCoupon(code) {
            console.log('✏️ 編集開始:', code);
            
            const coupon = couponSystem.getCoupon(code);
            if (!coupon) {
                showMessage('❌ クーポンが見つかりません', 'error');
                return;
            }

            currentEditingCode = code;
            
            // フォームに値を設定
            document.getElementById('edit-code').value = coupon.code;
            document.getElementById('edit-description').value = coupon.description || '';
            document.getElementById('edit-discount-type').value = coupon.discountType;
            document.getElementById('edit-discount-value').value = coupon.discountValue;
            document.getElementById('edit-max-uses').value = coupon.maxUses;
            document.getElementById('edit-is-active').checked = coupon.isActive !== false;
            
            // 有効期限の設定
            if (coupon.expiryDate) {
                if (coupon.expiryType === 'one_year') {
                    document.getElementById('edit-expiry-type').value = 'one_year';
                } else {
                    document.getElementById('edit-expiry-type').value = 'date';
                    document.getElementById('edit-expiry-date').value = coupon.expiryDate;
                }
            } else {
                document.getElementById('edit-expiry-type').value = 'unlimited';
            }
            
            // サービスチェックボックスを設定
            const editServicesContainer = document.getElementById('edit-services-checkboxes');
            editServicesContainer.innerHTML = '';
            
            Object.entries(couponSystem.serviceTypes).forEach(([key, name]) => {
                const isChecked = coupon.applicableServices.includes(key);
                const checkboxItem = document.createElement('div');
                checkboxItem.className = 'checkbox-item';
                checkboxItem.innerHTML = `
                    <input type="checkbox" id="edit-service-${key}" value="${key}" ${isChecked ? 'checked' : ''}>
                    <label for="edit-service-${key}">${name}</label>
                `;
                editServicesContainer.appendChild(checkboxItem);
            });
            
            updateEditDiscountInput();
            updateEditExpiryInput();
            
            // モーダルを表示
            document.getElementById('edit-modal').style.display = 'flex';
        }

        // 編集モーダルを閉じる
        function closeEditModal() {
            document.getElementById('edit-modal').style.display = 'none';
            currentEditingCode = null;
        }

        // 編集したクーポンを保存
        function saveEditedCoupon() {
            if (!currentEditingCode) return;

            const description = document.getElementById('edit-description').value.trim();
            const discountType = document.getElementById('edit-discount-type').value;
            const discountValue = parseFloat(document.getElementById('edit-discount-value').value);
            const maxUses = parseInt(document.getElementById('edit-max-uses').value);
            const expiryType = document.getElementById('edit-expiry-type').value;
            const isActive = document.getElementById('edit-is-active').checked;

            // 適用可能サービスを取得
            const selectedServices = [];
            document.querySelectorAll('#edit-services-checkboxes input[type="checkbox"]:checked').forEach(checkbox => {
                selectedServices.push(checkbox.value);
            });

            // 有効期限の設定
            let expiryDate = null;
            let expiryTypeValue = null;
            
            if (expiryType === 'date') {
                expiryDate = document.getElementById('edit-expiry-date').value;
            } else if (expiryType === 'one_year') {
                const oneYearLater = new Date();
                oneYearLater.setFullYear(oneYearLater.getFullYear() + 1);
                expiryDate = oneYearLater.toISOString().split('T')[0];
                expiryTypeValue = 'one_year';
            }

            // バリデーション
            if (!discountType || !discountValue) {
                showMessage('❌ 割引タイプと割引値を設定してください', 'error');
                return;
            }

            if (selectedServices.length === 0) {
                showMessage('❌ 適用可能サービスを1つ以上選択してください', 'error');
                return;
            }

            const updates = {
                description,
                discountType,
                discountValue,
                maxUses,
                expiryDate,
                expiryType: expiryTypeValue,
                applicableServices: selectedServices,
                isActive
            };

            const result = couponSystem.updateCoupon(currentEditingCode, updates);
            
            if (result.success) {
                showMessage(`✅ クーポン「${currentEditingCode}」を更新しました`, 'success');
                closeEditModal();
                loadCoupons();
                loadStats();
            } else {
                showMessage('❌ クーポンの更新に失敗しました', 'error');
            }
        }

        // クーポンの有効/無効を切り替え
        function toggleCouponStatus(code, currentStatus) {
            const newStatus = !currentStatus;
            const result = couponSystem.updateCoupon(code, { isActive: newStatus });
            
            if (result.success) {
                const statusText = newStatus ? '有効' : '無効';
                showMessage(`✅ クーポン「${code}」を${statusText}にしました`, 'success');
                loadCoupons();
                loadStats();
            } else {
                showMessage('❌ ステータスの変更に失敗しました', 'error');
            }
        }

        // 使用履歴を表示
        function viewUsageHistory(code) {
            console.log('📊 使用履歴表示:', code);
            
            const usage = couponSystem.getAllUsage().filter(u => u.couponCode === code);
            const coupon = couponSystem.getCoupon(code);
            
            let historyHTML = `
                <div style="margin-bottom: 20px;">
                    <h3 style="color: #ffd700;">クーポン「${code}」</h3>
                    <p style="color: rgba(255,255,255,0.8);">${coupon?.description || '説明なし'}</p>
                </div>
            `;
            
            if (usage.length === 0) {
                historyHTML += '<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 40px;">使用履歴はありません</p>';
            } else {
                historyHTML += `
                    <div style="margin-bottom: 20px;">
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                            <div class="stat-card">
                                <div class="stat-number">${usage.length}</div>
                                <div>総使用回数</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">¥${usage.reduce((sum, u) => sum + (u.discountAmount || 0), 0).toLocaleString()}</div>
                                <div>総割引額</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-number">${[...new Set(usage.map(u => u.userEmail))].length}</div>
                                <div>利用者数</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="max-height: 400px; overflow-y: auto;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: rgba(255,255,255,0.1);">
                                    <th style="padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);">使用日時</th>
                                    <th style="padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);">サービス</th>
                                    <th style="padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.2);">利用者</th>
                                    <th style="padding: 10px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.2);">割引額</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                usage.reverse().forEach(u => {
                    const serviceTypeName = couponSystem.serviceTypes[u.serviceType] || u.serviceType;
                    historyHTML += `
                        <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
                            <td style="padding: 10px;">${new Date(u.usedAt).toLocaleString()}</td>
                            <td style="padding: 10px;">${serviceTypeName}</td>
                            <td style="padding: 10px; font-family: monospace;">${u.userEmail}</td>
                            <td style="padding: 10px; text-align: right; color: #4caf50; font-weight: bold;">¥${(u.discountAmount || 0).toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                historyHTML += '</tbody></table></div>';
            }
            
            document.getElementById('history-content').innerHTML = historyHTML;
            document.getElementById('history-modal').style.display = 'flex';
        }

        // 使用履歴モーダルを閉じる
        function closeHistoryModal() {
            document.getElementById('history-modal').style.display = 'none';
        }

        console.log('🚀 直接管理画面スクリプト読み込み完了');
        
        // テスト用のグローバル関数を追加（デバッグ用）
        window.debugCouponSystem = function() {
            console.log('🔍 デバッグ情報:');
            console.log('couponSystem:', couponSystem);
            console.log('全クーポン:', couponSystem.getAllCoupons());
            console.log('LocalStorage:', localStorage.getItem('serafina_coupons'));
            
            // テストクーポンを作成
            const testCoupon = {
                code: 'DEBUG' + Math.random().toString(36).substr(2, 4).toUpperCase(),
                description: 'デバッグテスト用',
                discountType: 'fixed',
                discountValue: 100,
                maxUses: 1,
                applicableServices: ['all']
            };
            
            console.log('🧪 テストクーポンを作成:', testCoupon);
            const result = couponSystem.createCoupon(testCoupon);
            console.log('🧪 作成結果:', result);
            
            if (result.success) {
                loadCoupons();
                loadStats();
            }
        };
        
        // コンソールからテスト実行できるようにメッセージ表示
        console.log('💡 テスト用コマンド: debugCouponSystem() を実行してテストクーポンを作成');
        
        // エラーハンドリングを追加
        window.addEventListener('error', function(e) {
            console.error('❌ JavaScript エラー:', e.error);
            showMessage('JavaScript エラーが発生しました。コンソールを確認してください。', 'error');
        });
    </script>
</body>
