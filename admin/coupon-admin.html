<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クーポン管理 - Salon de Serafina Admin</title>
    
    <!-- クーポンシステム -->
    <script src="../js/coupon-system.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .admin-header h1 {
            color: #ffd700;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section-title {
            color: #ffd700;
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .form-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .form-row .form-group {
            flex: 1;
            min-width: 200px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #2d1b69;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        .btn-danger {
            background: linear-gradient(45deg, #f44336, #ff6659);
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .coupon-list {
            display: grid;
            gap: 20px;
        }

        .coupon-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: all 0.3s ease;
        }

        .coupon-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .coupon-code {
            font-size: 1.3em;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .coupon-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 5px;
        }

        .detail-value {
            color: #fff;
            font-weight: bold;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-active {
            background: #4caf50;
            color: white;
        }

        .status-inactive {
            background: #f44336;
            color: white;
        }

        .status-expired {
            background: #ff9800;
            color: white;
        }

        .services-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        .service-tag {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1em;
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
        }

        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
            }
            
            .coupon-details {
                grid-template-columns: 1fr;
            }
            
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- パスワード認証画面 -->
    <div id="auth-screen" class="admin-container">
        <div class="admin-header">
            <h1>🔐 管理者認証</h1>
            <p>Salon de Serafina - 管理者画面</p>
        </div>
        
        <div class="admin-section" style="max-width: 400px; margin: 50px auto;">
            <h2 class="section-title">🔑 パスワードを入力してください</h2>
            
            <div id="auth-message" style="margin-bottom: 20px;"></div>
            
            <div class="form-group">
                <label for="admin-password">管理者パスワード</label>
                <input type="password" id="admin-password" placeholder="パスワードを入力" autocomplete="off">
            </div>
            
            <button onclick="authenticateAdmin()" class="btn btn-primary" style="width: 100%;">
                🔓 ログイン
            </button>
            
            <div style="margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 14px;">
                <p style="margin: 0; color: rgba(255,255,255,0.7);">
                    💡 <strong>管理者パスワード:</strong> serafina2024<br>
                    （本番環境では必ず変更してください）
                </p>
            </div>
        </div>
    </div>

    <!-- 管理画面本体 -->
    <div id="admin-main" class="admin-container" style="display: none;">
        <div class="admin-header">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h1>🎫 クーポン管理システム</h1>
                    <p>Salon de Serafina - 管理者画面</p>
                </div>
                <button onclick="logoutAdmin()" class="btn btn-secondary">
                    🚪 ログアウト
                </button>
            </div>
        </div>

        <!-- 統計情報 -->
        <div class="admin-section">
            <h2 class="section-title">📊 統計情報</h2>
            <div class="stats-grid" id="stats-grid">
                <!-- 統計カードがJavaScriptで生成される -->
            </div>
        </div>

        <!-- クイックアクション -->
        <div class="admin-section">
            <h2 class="section-title">⚡ クイックアクション</h2>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px;">
                <button onclick="createQuickCoupon('LINE500', 'amount', 500, 1, 30, ['all'], 'LINE登録特典500円OFF')" class="btn btn-primary">
                    💚 LINE特典クーポン
                </button>
                <button onclick="createQuickCoupon('MONITOR100', 'percentage', 100, 1, 7, ['shintaku'], 'モニター用100%OFF')" class="btn btn-primary">
                    🔬 モニタークーポン
                </button>
                <button onclick="createQuickCoupon('WELCOME20', 'percentage', 20, 5, 60, ['all'], '新規お客様20%OFF')" class="btn btn-primary">
                    🎉 新規お客様クーポン
                </button>
                <button onclick="generateRandomCoupon()" class="btn btn-secondary">
                    🎲 ランダムクーポン生成
                </button>
            </div>
        </div>

        <!-- 新規クーポン作成 -->
        <div class="admin-section">
            <h2 class="section-title">➕ 新規クーポン作成</h2>
            
            <div id="create-message"></div>
            
            <form id="create-coupon-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="coupon-code">クーポンコード *</label>
                        <input type="text" id="coupon-code" name="code" required placeholder="例: WELCOME50" style="text-transform: uppercase;">
                    </div>
                    <div class="form-group">
                        <label for="discount-type">割引種別 *</label>
                        <select id="discount-type" name="discountType" required>
                            <option value="amount">金額割引（円）</option>
                            <option value="percentage">パーセント割引（%）</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="discount-value">割引値 *</label>
                        <input type="number" id="discount-value" name="discountValue" required min="1" placeholder="例: 500 または 20">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="max-uses">最大使用回数 *</label>
                        <input type="number" id="max-uses" name="maxUses" required min="1" placeholder="例: 100">
                    </div>
                    <div class="form-group">
                        <label for="expiry-date">有効期限 *</label>
                        <input type="date" id="expiry-date" name="expiryDate" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">説明</label>
                    <textarea id="description" name="description" rows="3" placeholder="クーポンの説明を入力"></textarea>
                </div>

                <div class="form-group">
                    <label>適用可能サービス *</label>
                    <div class="checkbox-group" id="services-checkboxes">
                        <!-- サービスチェックボックスがJavaScriptで生成される -->
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">🎫 クーポンを作成</button>
                <button type="reset" class="btn btn-secondary">リセット</button>
            </form>
        </div>

        <!-- 既存クーポン一覧 -->
        <div class="admin-section">
            <h2 class="section-title">📋 既存クーポン一覧</h2>
            
            <div class="form-row" style="margin-bottom: 20px;">
                <div class="form-group">
                    <input type="text" id="search-coupon" placeholder="クーポンコードで検索...">
                </div>
                <div class="form-group">
                    <select id="filter-status">
                        <option value="">全ステータス</option>
                        <option value="active">アクティブ</option>
                        <option value="expired">期限切れ</option>
                        <option value="used-up">使用済み</option>
                    </select>
                </div>
                <div class="form-group">
                    <button onclick="bulkDeleteExpired()" class="btn btn-danger">
                        🗑️ 期限切れ一括削除
                    </button>
                </div>
                <div class="form-group">
                    <button onclick="exportCouponData()" class="btn btn-secondary">
                        📁 データエクスポート
                    </button>
                </div>
            </div>

            <div class="coupon-list" id="coupon-list">
                <!-- クーポンカードがJavaScriptで生成される -->
            </div>
        </div>
    </div>

    <!-- 編集モーダル（簡易版） -->
    <div id="edit-modal" class="hidden" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
    ">
        <div style="
            background: #2d1b69;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #ffd700;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        ">
            <h3 style="color: #ffd700; margin-bottom: 20px;">クーポン編集</h3>
            <div id="edit-form-content">
                <!-- 編集フォームがJavaScriptで生成される -->
            </div>
            <div style="margin-top: 20px;">
                <button onclick="saveEdit()" class="btn btn-primary">保存</button>
                <button onclick="closeEditModal()" class="btn btn-secondary">キャンセル</button>
            </div>
        </div>
    </div>

    <script>
        // グローバル変数
        let couponSystem;
        let currentEditingCode = null;
        let isAuthenticated = false;
        const ADMIN_PASSWORD = 'serafina2024'; // 本番では環境変数などで管理

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            // パスワード入力でEnterキーを有効にする
            document.getElementById('admin-password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    authenticateAdmin();
                }
            });

            // セッション確認
            if (sessionStorage.getItem('admin_authenticated') === 'true') {
                showMainAdmin();
            }
        });

        // 管理者認証
        function authenticateAdmin() {
            const password = document.getElementById('admin-password').value;
            const messageDiv = document.getElementById('auth-message');
            
            if (password === ADMIN_PASSWORD) {
                isAuthenticated = true;
                sessionStorage.setItem('admin_authenticated', 'true');
                showMainAdmin();
            } else {
                messageDiv.innerHTML = '<div class="message message-error">❌ パスワードが正しくありません</div>';
                document.getElementById('admin-password').value = '';
                setTimeout(() => {
                    messageDiv.innerHTML = '';
                }, 3000);
            }
        }

        // メイン管理画面を表示
        function showMainAdmin() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('admin-main').style.display = 'block';
            
            // クーポンシステム初期化
            couponSystem = window.couponSystem;
            
            if (!couponSystem) {
                alert('クーポンシステムの初期化に失敗しました。ページを再読み込みしてください。');
                return;
            }

            initializeUI();
            loadCoupons();
            loadStats();
            bindEvents();
        }

        // ログアウト
        function logoutAdmin() {
            if (confirm('ログアウトしますか？')) {
                isAuthenticated = false;
                sessionStorage.removeItem('admin_authenticated');
                document.getElementById('auth-screen').style.display = 'block';
                document.getElementById('admin-main').style.display = 'none';
                document.getElementById('admin-password').value = '';
            }
        }

        // UI初期化
        function initializeUI() {
            // サービスチェックボックスを生成
            const servicesContainer = document.getElementById('services-checkboxes');
            const services = couponSystem.serviceTypes;
            
            for (const [key, name] of Object.entries(services)) {
                const checkboxDiv = document.createElement('div');
                checkboxDiv.className = 'checkbox-item';
                checkboxDiv.innerHTML = `
                    <input type="checkbox" id="service-${key}" name="applicableServices" value="${key}">
                    <label for="service-${key}">${name}</label>
                `;
                servicesContainer.appendChild(checkboxDiv);
            }

            // デフォルトの有効期限を30日後に設定
            const expiryDate = document.getElementById('expiry-date');
            const thirtyDaysLater = new Date();
            thirtyDaysLater.setDate(thirtyDaysLater.getDate() + 30);
            expiryDate.value = thirtyDaysLater.toISOString().split('T')[0];
        }

        // イベントバインド
        function bindEvents() {
            // フォーム送信
            document.getElementById('create-coupon-form').addEventListener('submit', handleCreateCoupon);
            
            // 検索とフィルター
            document.getElementById('search-coupon').addEventListener('input', filterCoupons);
            document.getElementById('filter-status').addEventListener('change', filterCoupons);
            
            // 割引タイプ変更時の説明更新
            document.getElementById('discount-type').addEventListener('change', updateDiscountPlaceholder);
        }

        // 割引値のプレースホルダー更新
        function updateDiscountPlaceholder() {
            const discountType = document.getElementById('discount-type').value;
            const discountValue = document.getElementById('discount-value');
            
            if (discountType === 'percentage') {
                discountValue.placeholder = '例: 20 (20%OFF)';
                discountValue.max = '100';
            } else {
                discountValue.placeholder = '例: 500 (500円OFF)';
                discountValue.removeAttribute('max');
            }
        }

        // 新規クーポン作成
        function handleCreateCoupon(event) {
            event.preventDefault();
            
            const formData = new FormData(event.target);
            const applicableServices = Array.from(document.querySelectorAll('input[name="applicableServices"]:checked')).map(cb => cb.value);
            
            if (applicableServices.length === 0) {
                showMessage('create-message', '適用可能サービスを最低1つ選択してください。', 'error');
                return;
            }

            const couponData = {
                code: formData.get('code'),
                discountType: formData.get('discountType'),
                discountValue: parseInt(formData.get('discountValue')),
                maxUses: parseInt(formData.get('maxUses')),
                expiryDate: formData.get('expiryDate'),
                description: formData.get('description'),
                applicableServices: applicableServices
            };

            const result = couponSystem.createCoupon(couponData);
            
            if (result.success) {
                showMessage('create-message', 'クーポンが正常に作成されました！', 'success');
                event.target.reset();
                // チェックボックスをリセット
                document.querySelectorAll('input[name="applicableServices"]').forEach(cb => cb.checked = false);
                loadCoupons();
                loadStats();
            } else {
                showMessage('create-message', result.error, 'error');
            }
        }

        // メッセージ表示
        function showMessage(containerId, message, type) {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="message message-${type}">${message}</div>`;
            
            setTimeout(() => {
                container.innerHTML = '';
            }, 5000);
        }

        // クーポン一覧読み込み
        function loadCoupons() {
            const coupons = couponSystem.getAllCoupons();
            const container = document.getElementById('coupon-list');
            
            if (Object.keys(coupons).length === 0) {
                container.innerHTML = '<p style="text-align: center; color: rgba(255,255,255,0.7);">クーポンがありません。</p>';
                return;
            }

            container.innerHTML = '';
            
            for (const [code, coupon] of Object.entries(coupons)) {
                const card = createCouponCard(coupon);
                container.appendChild(card);
            }
        }

        // クーポンカード作成
        function createCouponCard(coupon) {
            const div = document.createElement('div');
            div.className = 'coupon-card';
            div.dataset.code = coupon.code;
            
            // ステータス判定
            const today = new Date().toISOString().split('T')[0];
            let status = 'active';
            let statusText = 'アクティブ';
            
            if (!coupon.isActive) {
                status = 'inactive';
                statusText = '無効';
            } else if (coupon.expiryDate < today) {
                status = 'expired';
                statusText = '期限切れ';
            } else if (coupon.currentUses >= coupon.maxUses) {
                status = 'used-up';
                statusText = '使用済み';
            }

            // 割引表示
            const discountDisplay = coupon.discountType === 'percentage' 
                ? `${coupon.discountValue}%OFF` 
                : `¥${coupon.discountValue.toLocaleString()}OFF`;

            // 適用サービス表示
            const servicesList = coupon.applicableServices.map(s => 
                `<span class="service-tag">${couponSystem.serviceTypes[s] || s}</span>`
            ).join('');

            div.innerHTML = `
                <div class="status-badge status-${status}">${statusText}</div>
                <div class="coupon-code">${coupon.code}</div>
                <div class="coupon-details">
                    <div class="detail-item">
                        <div class="detail-label">割引</div>
                        <div class="detail-value">${discountDisplay}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">使用回数</div>
                        <div class="detail-value">${coupon.currentUses} / ${coupon.maxUses}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">有効期限</div>
                        <div class="detail-value">${coupon.expiryDate}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">作成日</div>
                        <div class="detail-value">${new Date(coupon.createdAt).toLocaleDateString()}</div>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">説明</div>
                    <div class="detail-value">${coupon.description || '説明なし'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">適用サービス</div>
                    <div class="services-list">${servicesList}</div>
                </div>
                <div style="margin-top: 15px;">
                    <button onclick="editCoupon('${coupon.code}')" class="btn btn-secondary">編集</button>
                    <button onclick="toggleCoupon('${coupon.code}')" class="btn ${coupon.isActive ? 'btn-danger' : 'btn-primary'}">
                        ${coupon.isActive ? '無効化' : '有効化'}
                    </button>
                    <button onclick="deleteCoupon('${coupon.code}')" class="btn btn-danger">削除</button>
                </div>
            `;

            return div;
        }

        // 統計情報読み込み
        function loadStats() {
            const coupons = couponSystem.getAllCoupons();
            const stats = couponSystem.getCouponStats();
            
            const totalCoupons = Object.keys(coupons).length;
            const activeCoupons = Object.values(coupons).filter(c => c.isActive).length;
            const totalUsage = Object.values(stats).reduce((sum, s) => sum + s.uses, 0);
            const totalDiscount = Object.values(stats).reduce((sum, s) => sum + s.totalDiscount, 0);

            const container = document.getElementById('stats-grid');
            container.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalCoupons}</div>
                    <div class="stat-label">総クーポン数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${activeCoupons}</div>
                    <div class="stat-label">アクティブ</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${totalUsage}</div>
                    <div class="stat-label">総使用回数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">¥${totalDiscount.toLocaleString()}</div>
                    <div class="stat-label">総割引額</div>
                </div>
            `;
        }

        // クーポンフィルター
        function filterCoupons() {
            const searchTerm = document.getElementById('search-coupon').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const cards = document.querySelectorAll('.coupon-card');
            
            cards.forEach(card => {
                const code = card.dataset.code.toLowerCase();
                const statusBadge = card.querySelector('.status-badge');
                const status = statusBadge.className.includes('status-active') ? 'active' : 
                             statusBadge.className.includes('status-expired') ? 'expired' : 'used-up';
                
                const matchesSearch = code.includes(searchTerm);
                const matchesStatus = !statusFilter || status === statusFilter;
                
                card.style.display = matchesSearch && matchesStatus ? 'block' : 'none';
            });
        }

        // クーポン編集
        function editCoupon(code) {
            const coupons = couponSystem.getAllCoupons();
            const coupon = coupons[code];
            
            if (!coupon) return;

            currentEditingCode = code;
            
            // 編集フォーム生成
            const formContent = document.getElementById('edit-form-content');
            formContent.innerHTML = `
                <div class="form-group">
                    <label>クーポンコード</label>
                    <input type="text" id="edit-code" value="${coupon.code}" readonly style="background: rgba(255,255,255,0.1);">
                </div>
                <div class="form-group">
                    <label>最大使用回数</label>
                    <input type="number" id="edit-max-uses" value="${coupon.maxUses}" min="1">
                </div>
                <div class="form-group">
                    <label>有効期限</label>
                    <input type="date" id="edit-expiry" value="${coupon.expiryDate}">
                </div>
                <div class="form-group">
                    <label>説明</label>
                    <textarea id="edit-description" rows="3">${coupon.description || ''}</textarea>
                </div>
            `;
            
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        // 編集保存
        function saveEdit() {
            if (!currentEditingCode) return;
            
            const updates = {
                maxUses: parseInt(document.getElementById('edit-max-uses').value),
                expiryDate: document.getElementById('edit-expiry').value,
                description: document.getElementById('edit-description').value
            };
            
            const result = couponSystem.updateCoupon(currentEditingCode, updates);
            
            if (result.success) {
                closeEditModal();
                loadCoupons();
                loadStats();
                alert('クーポンが正常に更新されました。');
            } else {
                alert('エラー: ' + result.error);
            }
        }

        // 編集モーダルを閉じる
        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
            currentEditingCode = null;
        }

        // クーポン有効/無効切り替え
        function toggleCoupon(code) {
            const coupons = couponSystem.getAllCoupons();
            const coupon = coupons[code];
            
            if (!coupon) return;
            
            const result = couponSystem.updateCoupon(code, { isActive: !coupon.isActive });
            
            if (result.success) {
                loadCoupons();
                loadStats();
            } else {
                alert('エラー: ' + result.error);
            }
        }

        // クーポン削除
        function deleteCoupon(code) {
            if (!confirm(`クーポン "${code}" を削除しますか？この操作は取り消せません。`)) {
                return;
            }
            
            const result = couponSystem.deleteCoupon(code);
            
            if (result.success) {
                loadCoupons();
                loadStats();
                alert('クーポンが削除されました。');
            } else {
                alert('エラー: ' + result.error);
            }
        }

        // モーダル外クリックで閉じる
        document.getElementById('edit-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // クイッククーポン作成
        function createQuickCoupon(code, discountType, discountValue, maxUses, expiryDays, applicableServices, description) {
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + expiryDays);
            
            const couponData = {
                code: code,
                discountType: discountType,
                discountValue: discountValue,
                maxUses: maxUses,
                expiryDate: expiryDate.toISOString().split('T')[0],
                description: description,
                applicableServices: applicableServices
            };

            const result = couponSystem.createCoupon(couponData);
            
            if (result.success) {
                showMessage('create-message', `✅ ${code} クーポンが作成されました！`, 'success');
                loadCoupons();
                loadStats();
            } else {
                showMessage('create-message', `❌ エラー: ${result.error}`, 'error');
            }
        }

        // ランダムクーポン生成
        function generateRandomCoupon() {
            const prefixes = ['SPECIAL', 'LUCKY', 'MAGIC', 'STAR', 'MOON', 'SUN'];
            const numbers = Math.floor(Math.random() * 999) + 100;
            const randomCode = prefixes[Math.floor(Math.random() * prefixes.length)] + numbers;
            
            const discountTypes = [
                { type: 'amount', value: [300, 500, 1000] },
                { type: 'percentage', value: [10, 15, 20, 25] }
            ];
            
            const selectedType = discountTypes[Math.floor(Math.random() * discountTypes.length)];
            const discountValue = selectedType.value[Math.floor(Math.random() * selectedType.value.length)];
            
            const maxUses = [1, 3, 5, 10][Math.floor(Math.random() * 4)];
            const expiryDays = [7, 14, 30, 60][Math.floor(Math.random() * 4)];
            
            // フォームに値を設定
            document.getElementById('coupon-code').value = randomCode;
            document.getElementById('discount-type').value = selectedType.type;
            document.getElementById('discount-value').value = discountValue;
            document.getElementById('max-uses').value = maxUses;
            
            const expiryDate = new Date();
            expiryDate.setDate(expiryDate.getDate() + expiryDays);
            document.getElementById('expiry-date').value = expiryDate.toISOString().split('T')[0];
            
            document.getElementById('description').value = `ランダム生成クーポン - ${discountValue}${selectedType.type === 'percentage' ? '%' : '円'}OFF`;
            
            // 全サービスを選択
            document.querySelector('input[value="all"]').checked = true;
            
            showMessage('create-message', `🎲 ランダムクーポン「${randomCode}」が生成されました！フォームを確認して作成ボタンを押してください。`, 'success');
        }

        // 既存クーポンの一括操作
        function bulkDeleteExpired() {
            if (!confirm('期限切れのクーポンを一括削除しますか？')) return;
            
            const today = new Date().toISOString().split('T')[0];
            const coupons = couponSystem.getAllCoupons();
            let deletedCount = 0;
            
            for (const [code, coupon] of Object.entries(coupons)) {
                if (coupon.expiryDate < today) {
                    couponSystem.deleteCoupon(code);
                    deletedCount++;
                }
            }
            
            if (deletedCount > 0) {
                alert(`${deletedCount}個の期限切れクーポンを削除しました。`);
                loadCoupons();
                loadStats();
            } else {
                alert('期限切れクーポンはありませんでした。');
            }
        }

        // データエクスポート機能
        function exportCouponData() {
            const coupons = couponSystem.getAllCoupons();
            const usage = couponSystem.usage;
            
            const data = {
                exportDate: new Date().toISOString(),
                coupons: coupons,
                usage: usage,
                stats: couponSystem.getCouponStats()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `serafina-coupons-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            alert('📁 クーポンデータをエクスポートしました！');
        }
    </script>
</body>
</html>
