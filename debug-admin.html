<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>デバッグ用クーポン管理 - Salon de Serafina</title>
    
    <!-- クーポンシステム -->
    <script src="js/coupon-system.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .section {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .section h2 {
            color: #ffd700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .coupon-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .coupon-code {
            font-size: 1.2em;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: bold;
        }

        .message-success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }

        .message-error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .debug-log {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #ffd700; text-align: center; margin-bottom: 30px;">🎫 デバッグ用クーポン管理</h1>
        
        <!-- デバッグログ -->
        <div class="section">
            <h2>🔍 デバッグログ</h2>
            <div id="debug-log" class="debug-log">
                ページ読み込み開始...<br>
            </div>
            <button class="btn btn-secondary" onclick="clearDebugLog()">ログクリア</button>
        </div>

        <!-- システム状態 -->
        <div class="section">
            <h2>📊 システム状態</h2>
            <div id="system-status">
                確認中...
            </div>
            <button class="btn btn-secondary" onclick="checkSystemStatus()">状態更新</button>
        </div>

        <!-- 簡単なクーポン作成 -->
        <div class="section">
            <h2>➕ シンプルクーポン作成</h2>
            <div class="form-group">
                <label>クーポンコード</label>
                <input type="text" id="simple-code" placeholder="TEST123" value="SIMPLE001">
            </div>
            <div class="form-group">
                <label>割引額（円）</label>
                <input type="number" id="simple-discount" placeholder="500" value="500">
            </div>
            <button class="btn btn-primary" onclick="createSimpleCoupon()">作成</button>
        </div>

        <!-- クーポン一覧 -->
        <div class="section">
            <h2>📋 クーポン一覧</h2>
            <button class="btn btn-secondary" onclick="loadCouponsList()">一覧更新</button>
            <div id="coupons-container">
                読み込み中...
            </div>
        </div>
    </div>

    <script>
        // グローバル変数
        let couponSystem = null;
        let debugMessages = [];

        // デバッグログ関数
        function addDebugLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `[${timestamp}] ${message}`;
            debugMessages.push(logMessage);
            
            const logContainer = document.getElementById('debug-log');
            if (logContainer) {
                logContainer.innerHTML = debugMessages.slice(-10).join('<br>') + '<br>';
                logContainer.scrollTop = logContainer.scrollHeight;
            }
            
            console.log(logMessage);
        }

        function clearDebugLog() {
            debugMessages = [];
            document.getElementById('debug-log').innerHTML = 'ログがクリアされました<br>';
        }

        // システム状態確認
        function checkSystemStatus() {
            addDebugLog('システム状態を確認中...');
            
            let status = '';
            
            // couponSystem の存在確認
            if (window.couponSystem) {
                status += '✅ window.couponSystem: 存在<br>';
                couponSystem = window.couponSystem;
            } else if (window.CouponSystem) {
                status += '⚠️ window.couponSystem: 不在、CouponSystemクラス: 存在<br>';
                try {
                    couponSystem = new window.CouponSystem();
                    window.couponSystem = couponSystem;
                    status += '✅ 新しいインスタンスを作成<br>';
                } catch (error) {
                    status += `❌ インスタンス作成エラー: ${error.message}<br>`;
                }
            } else {
                status += '❌ CouponSystemクラス: 不在<br>';
            }

            if (couponSystem) {
                try {
                    const coupons = couponSystem.getAllCoupons();
                    status += `📊 現在のクーポン数: ${coupons.length}<br>`;
                    
                    const localStorage = window.localStorage.getItem('serafina_coupons');
                    status += `💾 LocalStorage: ${localStorage ? '存在' : '空'}<br>`;
                } catch (error) {
                    status += `❌ クーポン取得エラー: ${error.message}<br>`;
                }
            }

            document.getElementById('system-status').innerHTML = status;
            addDebugLog('システム状態確認完了');
        }

        // シンプルクーポン作成
        function createSimpleCoupon() {
            addDebugLog('シンプルクーポン作成開始');
            
            if (!couponSystem) {
                addDebugLog('❌ couponSystemが初期化されていません');
                showMessage('システムエラー: couponSystemが利用できません', 'error');
                return;
            }

            const code = document.getElementById('simple-code').value.trim();
            const discount = parseInt(document.getElementById('simple-discount').value);

            if (!code || !discount) {
                addDebugLog('❌ 入力値が不正です');
                showMessage('コードと割引額を入力してください', 'error');
                return;
            }

            const couponData = {
                code: code.toUpperCase(),
                description: 'テスト用クーポン',
                discountType: 'fixed',
                discountValue: discount,
                maxUses: 1,
                applicableServices: ['all']
            };

            addDebugLog(`クーポンデータ: ${JSON.stringify(couponData)}`);

            try {
                const result = couponSystem.createCoupon(couponData);
                addDebugLog(`作成結果: ${JSON.stringify(result)}`);
                
                if (result && result.success) {
                    showMessage(`✅ クーポン「${code}」を作成しました`, 'success');
                    document.getElementById('simple-code').value = '';
                    document.getElementById('simple-discount').value = '500';
                    loadCouponsList();
                } else {
                    const errorMsg = result && result.error ? result.error : '不明なエラー';
                    showMessage(`❌ 作成失敗: ${errorMsg}`, 'error');
                }
            } catch (error) {
                addDebugLog(`❌ 例外エラー: ${error.message}`);
                showMessage(`❌ エラー: ${error.message}`, 'error');
            }
        }

        // クーポン一覧読み込み
        function loadCouponsList() {
            addDebugLog('クーポン一覧読み込み開始');
            
            if (!couponSystem) {
                addDebugLog('❌ couponSystemが初期化されていません');
                document.getElementById('coupons-container').innerHTML = '<p style="color: #f44336;">システムエラー</p>';
                return;
            }

            try {
                const coupons = couponSystem.getAllCoupons();
                addDebugLog(`取得したクーポン数: ${coupons.length}`);
                
                const container = document.getElementById('coupons-container');
                
                if (coupons.length === 0) {
                    container.innerHTML = '<p style="color: rgba(255,255,255,0.7);">クーポンがありません</p>';
                    return;
                }

                container.innerHTML = '';
                
                coupons.forEach((coupon, index) => {
                    addDebugLog(`クーポン${index + 1}: ${coupon.code}`);
                    
                    const item = document.createElement('div');
                    item.className = 'coupon-item';
                    
                    item.innerHTML = `
                        <div class="coupon-code">${coupon.code}</div>
                        <div>説明: ${coupon.description || 'なし'}</div>
                        <div>割引: ${coupon.discountValue}${coupon.discountType === 'percentage' ? '%' : '円'}</div>
                        <div>使用回数: ${coupon.currentUses}/${coupon.maxUses}</div>
                        <div style="margin-top: 10px;">
                            <button class="btn btn-secondary" onclick="editCouponSafe('${coupon.code}')">✏️ 編集</button>
                            <button class="btn btn-secondary" onclick="viewHistorySafe('${coupon.code}')">📊 履歴</button>
                            <button class="btn btn-secondary" onclick="deleteCouponSafe('${coupon.code}')">🗑️ 削除</button>
                        </div>
                    `;
                    
                    container.appendChild(item);
                });
                
                addDebugLog('一覧表示完了');
            } catch (error) {
                addDebugLog(`❌ 一覧読み込みエラー: ${error.message}`);
                document.getElementById('coupons-container').innerHTML = `<p style="color: #f44336;">エラー: ${error.message}</p>`;
            }
        }

        // 安全な編集関数
        function editCouponSafe(code) {
            addDebugLog(`編集ボタンクリック: ${code}`);
            alert(`編集機能（クーポン: ${code}）\n\n現在はデバッグモードです。\n本格的な編集機能は別途実装予定です。`);
        }

        // 安全な履歴表示関数
        function viewHistorySafe(code) {
            addDebugLog(`履歴ボタンクリック: ${code}`);
            
            if (!couponSystem) {
                alert('システムエラー: couponSystemが利用できません');
                return;
            }

            try {
                const usage = couponSystem.getAllUsage().filter(u => u.couponCode === code);
                
                if (usage.length === 0) {
                    alert(`クーポン「${code}」の使用履歴はありません。`);
                } else {
                    const historyText = usage.map(u => {
                        return `${new Date(u.usedAt).toLocaleString()} - ${u.serviceType} - ${u.discountAmount}円割引`;
                    }).join('\n');
                    
                    alert(`クーポン「${code}」の使用履歴:\n\n${historyText}`);
                }
            } catch (error) {
                addDebugLog(`❌ 履歴表示エラー: ${error.message}`);
                alert(`エラー: ${error.message}`);
            }
        }

        // 安全な削除関数
        function deleteCouponSafe(code) {
            addDebugLog(`削除ボタンクリック: ${code}`);
            
            if (!confirm(`クーポン「${code}」を削除しますか？`)) {
                return;
            }

            try {
                const result = couponSystem.deleteCoupon(code);
                if (result && result.success) {
                    showMessage(`✅ クーポン「${code}」を削除しました`, 'success');
                    loadCouponsList();
                } else {
                    showMessage('❌ 削除に失敗しました', 'error');
                }
            } catch (error) {
                addDebugLog(`❌ 削除エラー: ${error.message}`);
                showMessage(`❌ エラー: ${error.message}`, 'error');
            }
        }

        // メッセージ表示
        function showMessage(message, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${type}`;
            messageDiv.textContent = message;
            
            const container = document.querySelector('.container');
            container.insertBefore(messageDiv, container.firstChild);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', function() {
            addDebugLog('DOM読み込み完了');
            
            // エラーハンドリング
            window.addEventListener('error', function(e) {
                addDebugLog(`❌ JavaScript エラー: ${e.error ? e.error.message : e.message}`);
                console.error('JavaScript エラー:', e.error);
            });

            // システム状態確認
            setTimeout(() => {
                checkSystemStatus();
                loadCouponsList();
            }, 500);
            
            addDebugLog('初期化完了');
        });
    </script>
</body>
</html>
