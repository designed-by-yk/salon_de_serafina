<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 管理者ポータル - Salon de Serafina</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b69 50%, #1a0033 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            max-width: 400px;
            width: 100%;
        }

        .portal-icon {
            font-size: 4em;
            margin-bottom: 20px;
            display: block;
        }

        .portal-title {
            color: #ffd700;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .portal-subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .login-form {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            margin: 10px 0;
        }

        .btn-primary {
            background: linear-gradient(45deg, #ff6b6b, #ffd700);
            color: #2d1b69;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .access-menu {
            display: none;
        }

        .access-menu.show {
            display: block;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 16px;
        }

        .menu-item:hover {
            background: rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .menu-item .icon {
            font-size: 1.2em;
            margin-right: 10px;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 10px;
            border-radius: 8px;
            margin: 15px 0;
            display: none;
        }

        .security-info {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid rgba(255, 193, 7, 0.3);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .portal-container {
                padding: 30px 20px;
            }

            .portal-icon {
                font-size: 3em;
            }

            .portal-title {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <a href="omikuji/index.html" class="back-btn">🏠 トップページに戻る</a>
    
    <div class="portal-container">
        <div class="portal-icon">🔐</div>
        <h1 class="portal-title">管理者ポータル</h1>
        <p class="portal-subtitle">Salon de Serafina</p>

        <!-- ログインフォーム -->
        <div id="login-form" class="login-form">
            <div class="form-group">
                <label for="admin-password">管理者パスワード</label>
                <input type="password" id="admin-password" placeholder="パスワードを入力してください" onkeypress="handleKeyPress(event)">
            </div>
            
            <button class="btn btn-primary" onclick="login()">
                🔓 ログイン
            </button>
            
            <div id="error-message" class="error-message"></div>
            
            <div class="security-info">
                🛡️ <strong>セキュリティ情報</strong><br>
                このページは管理者専用です。正しいパスワードを入力してアクセスしてください。
            </div>
        </div>

        <!-- アクセスメニュー -->
        <div id="access-menu" class="access-menu">
            <div id="success-message" class="success-message">
                ✅ ログインに成功しました！
            </div>
            
            <a href="ultimate-admin.html" class="menu-item">
                <span class="icon">🎫</span>
                クーポン管理システム
            </a>
            
            <a href="javascript:void(0)" onclick="openQuickAccess()" class="menu-item">
                <span class="icon">⚡</span>
                クイック管理画面
            </a>
            
            <a href="javascript:void(0)" onclick="viewSystemStatus()" class="menu-item">
                <span class="icon">📊</span>
                システム状況確認
            </a>
            
            <a href="javascript:void(0)" onclick="createBookmark()" class="menu-item">
                <span class="icon">🔖</span>
                ブックマーク用リンク作成
            </a>
            
            <button class="btn btn-secondary" onclick="logout()">
                🔒 ログアウト
            </button>
        </div>
    </div>

    <script>
        // 管理者パスワード（実際の運用では環境変数等で管理）
        const ADMIN_PASSWORD = 'serafina2025admin';
        
        // セッション管理
        const SESSION_KEY = 'serafina_admin_session';
        const SESSION_DURATION = 24 * 60 * 60 * 1000; // 24時間

        // ページ読み込み時の処理
        document.addEventListener('DOMContentLoaded', function() {
            checkSession();
        });

        // セッション確認
        function checkSession() {
            const session = localStorage.getItem(SESSION_KEY);
            if (session) {
                try {
                    const sessionData = JSON.parse(session);
                    const now = new Date().getTime();
                    
                    if (now - sessionData.timestamp < SESSION_DURATION) {
                        // セッション有効
                        showAccessMenu();
                        return;
                    } else {
                        // セッション期限切れ
                        localStorage.removeItem(SESSION_KEY);
                    }
                } catch (error) {
                    localStorage.removeItem(SESSION_KEY);
                }
            }
            
            // ログインフォーム表示
            showLoginForm();
        }

        // キーボードイベント処理
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                login();
            }
        }

        // ログイン処理
        function login() {
            const passwordInput = document.getElementById('admin-password');
            const password = passwordInput.value.trim();
            const errorDiv = document.getElementById('error-message');

            if (!password) {
                showError('パスワードを入力してください');
                return;
            }

            if (password === ADMIN_PASSWORD) {
                // ログイン成功
                const sessionData = {
                    timestamp: new Date().getTime(),
                    user: 'admin'
                };
                localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                
                showAccessMenu();
                showSuccess('ログインに成功しました！');
                
                // パスワードフィールドをクリア
                passwordInput.value = '';
            } else {
                showError('パスワードが正しくありません');
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        // ログアウト処理
        function logout() {
            if (confirm('ログアウトしますか？')) {
                localStorage.removeItem(SESSION_KEY);
                showLoginForm();
                hideMessages();
            }
        }

        // ログインフォーム表示
        function showLoginForm() {
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('access-menu').classList.remove('show');
        }

        // アクセスメニュー表示
        function showAccessMenu() {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('access-menu').classList.add('show');
        }

        // エラーメッセージ表示
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 成功メッセージ表示
        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            if (successDiv) {
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    successDiv.style.display = 'none';
                }, 3000);
            }
        }

        // メッセージを隠す
        function hideMessages() {
            document.getElementById('error-message').style.display = 'none';
            const successDiv = document.getElementById('success-message');
            if (successDiv) {
                successDiv.style.display = 'none';
            }
        }

        // クイックアクセス（新しいタブで開く）
        function openQuickAccess() {
            window.open('ultimate-admin.html', '_blank');
        }

        // システム状況確認
        function viewSystemStatus() {
            if (typeof window.couponSystem !== 'undefined') {
                const stats = window.couponSystem.getStatistics();
                const statusInfo = `
                    📊 システム状況レポート
                    
                    🎫 クーポン総数: ${stats.totalCoupons}件
                    ✅ 有効クーポン: ${stats.activeCoupons}件
                    ❌ 無効クーポン: ${stats.inactiveCoupons}件
                    ⏰ 期限切れ: ${stats.expiredCoupons}件
                    
                    📈 使用統計:
                    • 総使用回数: ${stats.totalUsage}回
                    • 総割引額: ¥${stats.totalDiscount.toLocaleString()}
                    • 利用者数: ${stats.uniqueUsers}人
                    • 平均割引額: ¥${Math.round(stats.avgDiscountPerUse).toLocaleString()}
                    
                    最終更新: ${new Date().toLocaleString()}
                `;
                alert(statusInfo);
            } else {
                alert('❌ クーポンシステムが読み込まれていません');
            }
        }

        // ブックマーク用リンク作成
        function createBookmark() {
            const bookmarkData = {
                title: '🔐 Salon de Serafina 管理者ポータル',
                url: window.location.href
            };

            // クリップボードにコピー
            navigator.clipboard.writeText(bookmarkData.url).then(() => {
                alert(`
                    🔖 ブックマーク用情報
                    
                    タイトル: ${bookmarkData.title}
                    URL: ${bookmarkData.url}
                    
                    ✅ URLをクリップボードにコピーしました！
                    
                    📌 ブックマーク登録方法:
                    1. ブラウザのブックマークメニューを開く
                    2. 「新しいブックマーク」を選択
                    3. 上記のタイトルとURLを入力
                    4. お気に入りのフォルダに保存
                `);
            }).catch(() => {
                alert(`
                    🔖 ブックマーク用情報
                    
                    タイトル: ${bookmarkData.title}
                    URL: ${bookmarkData.url}
                    
                    📌 このURLをブックマークに保存してください
                `);
            });
        }

        // セキュリティ：開発者ツールの使用を検知
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && event.key === 'I') ||
                (event.ctrlKey && event.shiftKey && event.key === 'C')) {
                event.preventDefault();
                console.log('🛡️ セキュリティ: 開発者ツールへのアクセスが検知されました');
            }
        });

        // セキュリティ：右クリック無効化
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
        });

        // セキュリティ：ページ離脱時の警告
        window.addEventListener('beforeunload', function(event) {
            const session = localStorage.getItem(SESSION_KEY);
            if (session) {
                event.returnValue = '管理者セッションが有効です。ページを離れますか？';
            }
        });

        console.log('🔐 Admin Portal Security System Initialized');
    </script>
</body>
</html>
